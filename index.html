<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scrutinix AI - The First Interactive Sandbox Search Engine</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body { 
            background-color: #f8fafc; 
            color: #0f172a; 
            min-height: 100vh;
            display: flex;
            overflow-x: hidden;
        }

        /* 📁 बाईं तरफ का आलीशान साइडबार */
        .left-sidebar {
            width: 240px; background-color: #ffffff; border-right: 1px solid #e2e8f0;
            padding: 20px; display: flex; flex-direction: column; justify-content: space-between;
            height: 100vh; position: fixed; left: 0; top: 0; z-index: 1000;
        }

        .sidebar-brand { font-size: 22px; font-weight: bold; color: #2563eb; margin-bottom: 30px; }
        .sidebar-menu { display: flex; flex-direction: column; gap: 10px; flex-grow: 1; }
        
        .menu-link {
            color: #475569; text-decoration: none; padding: 12px 15px; border-radius: 8px;
            font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 12px; transition: 0.2s;
        }
        .menu-link:hover, .menu-link.active { background-color: #f1f5f9; color: #2563eb; }

        /* 💻 मुख्य कंटेंट एरिया */
        .main-content {
            margin-left: 240px; flex-grow: 1; display: flex; flex-direction: column;
            align-items: center; justify-content: center; padding: 40px; min-height: 100vh;
        }

        .home-heading { font-size: 38px; font-weight: 500; color: #0f172a; margin-bottom: 25px; text-align: center; }

        /* 🤍 आलीशान सफेद सर्च बॉक्स */
        .search-container-box {
            width: 100%; max-width: 740px; background: #ffffff; border-radius: 20px;
            border: 1px solid #cbd5e1; padding: 16px; box-shadow: 0 10px 30px rgba(15, 23, 42, 0.06);
            display: flex; flex-direction: column; gap: 12px;
        }

        .search-container-box textarea {
            width: 100%; height: 55px; background: transparent; border: none; color: #0f172a;
            font-size: 17px; outline: none; resize: none; font-family: inherit; padding: 5px;
        }

        .controls-row { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #f1f5f9; padding-top: 12px; }
        .buttons-group { display: flex; gap: 10px; align-items: center; }

        .pill-btn {
            background: #f8fafc; color: #475569; border: 1px solid #e2e8f0; padding: 8px 16px;
            border-radius: 20px; cursor: pointer; font-size: 13px; font-weight: bold; display: flex; align-items: center; gap: 6px; transition: 0.2s;
        }
        .pill-btn:hover { background: #e2e8f0; color: #2563eb; }

        .search-go-btn {
            background: #22c55e; color: white; border: none; padding: 10px 24px;
            border-radius: 25px; font-weight: bold; cursor: pointer; font-size: 14px;
        }
        .search-go-btn:hover { background: #16a34a; }

        /* 📊 लगातार बहने वाला स्ट्रीम रिस्पॉन्स होल्डर */
        .stream-board { width: 100%; max-width: 740px; margin-top: 30px; display: flex; flex-direction: column; gap: 20px; }
        
        .stream-card {
            background: #ffffff; border: 1px solid #e2e8f0; border-radius: 16px;
            padding: 22px; box-shadow: 0 4px 15px rgba(0,0,0,0.02); animation: slideIn 0.3s ease-out; color: #334155;
        }
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* 🎛️ यूनिक फीचर: इंटरैक्टिव लाइव सैंडबॉक्स विजेट */
        .interactive-sandbox {
            background: #f1f5f9; border-left: 5px solid #2563eb; padding: 15px; border-radius: 8px; margin: 15px 0;
        }

        .action-bar-bottom { display: flex; gap: 10px; margin-top: 15px; border-top: 1px solid #f1f5f9; padding-top: 15px; flex-wrap: wrap; }
        .action-trigger-btn { background: #f1f5f9; color: #2563eb; border: 1px solid #cbd5e1; padding: 8px 16px; border-radius: 20px; font-size: 12px; font-weight: bold; cursor: pointer; }
        .action-trigger-btn:hover { background: #2563eb; color: white; }

        .suggested-item { color: #475569; font-size: 13px; padding: 6px 0; cursor: pointer; }
        #loadingText { text-align: center; color: #94a3b8; margin-top: 20px; display: none; }
    </style>
</head>
<body>

    <!-- side बार -->
    <div class="left-sidebar">
        <div>
            <div class="sidebar-brand">Scrutinix AI</div>
            <div class="sidebar-menu">
                <a href="#" class="menu-link active">🌐 1. Web Search</a>
                <a href="#" class="menu-link" onclick="document.getElementById('codeFileUploader').click()">📎 2. Attach & Analyze</a>
                <a href="#" class="menu-link" onclick="startVoiceSearch()">🎙️ 3. Voice Search</a>
            </div>
        </div>
        <div class="sidebar-footer">
            <p style="color:#475569; font-weight:bold;">🎛️ Live Sandbox Active</p>
        </div>
    </div>

    <!-- मुख्य बोर्ड -->
    <div class="main-content">
        <div class="home-heading" id="mainPromptTitle">What do you want to know?</div>

        <div class="search-container-box">
            <textarea id="aiQuery" placeholder="सर्च करें (जैसे: blogging income, या वेबसाइट का ब्याज)..."></textarea>
            <div class="controls-row">
                <div class="buttons-group">
                    <button class="pill-btn" onclick="alert('Focus: Web Search Active 🌐')">🌐 Web Search</button>
                    <input type="file" id="codeFileUploader" style="display: none;" onchange="alert('File Loaded!')">
                    <button class="pill-btn" onclick="document.getElementById('codeFileUploader').click()">📎 Attach</button>
                    <button id="voiceBtn" class="pill-btn" onclick="startVoiceSearch()">🎙️ Mike</button>
                </div>
                <button class="search-go-btn" onclick="runAiStreamSearch()">Search 🚀</button>
            </div>
        </div>

        <p id="loadingText">AI लाइव सिमुलेशन सैंडबॉक्स तैयार कर रहा है... 🧠</p>
        <div id="streamBoard" class="stream-board"></div>
    </div>

    <script>
        function startVoiceSearch() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) return;
            const recognition = new SpeechRecognition(); recognition.lang = 'hi-IN';
            recognition.start();
            recognition.onresult = function(event) { document.getElementById('aiQuery').value = event.results.transcript; };
        }

        // जादुई स्लाइडर को कैलकुलेट करने का फ्रंटएंड फंक्शन (₹0 कॉस्ट)
        function calculateLiveSandbox(val, idText, idResult) {
            document.getElementById(idText).innerText = Number(val).toLocaleString();
            document.getElementById(idResult).innerText = (val * 15).toLocaleString(); // लाइव कैलकुलेशन गणित
        }

        async function runAiStreamSearch() {
            const query = document.getElementById('aiQuery').value;
            const streamBoard = document.getElementById('streamBoard');
            const title = document.getElementById('mainPromptTitle');
            const loadingText = document.getElementById('loadingText');

            if (!query) return;
            
            // 🌟 यहाँ अपनी असली फ्री Groq API Key डाल दें
            const apiKey = localStorage.getItem('scrutinix_groq_key') || 'gsk_YOUR_FREE_GROQ_KEY_HERE'; 
            if (apiKey === 'gsk_YOUR_FREE_GROQ_KEY_HERE') { alert("कृपया कोड की लाइन 101 में अपनी असली Groq Key पेस्ट करें!"); return; }

            title.style.fontSize = "24px"; title.innerText = "🔍 Scrutinix Sandbox Stream";
            loadingText.style.display = "block";
            document.getElementById('aiQuery').value = ""; 

            try {
                const response = await fetch("https://groq.com", {
                    method: "POST",
                    headers: { "Authorization": Bearer ${apiKey}, "Content-Type": "application/json" },
                    body: JSON.stringify({
                        model: "llama-3.1-8b-instant",
                        messages: [
                            { role: "system", content: "You are Scrutinix AI. Provide a clean direct answer in user's language. At the end, add '[FOLLOWUPS]' followed by 2 follow-up questions separated by '|'." },
                            { role: "user", content: query }
                        ]
                    })
                });

                const data = await response.json();
                loadingText.style.display = "none";

                if(data.choices) {
                    const fullText = data.choices.message.content;
                    const parts = fullText.split('[FOLLOWUPS]');
                    const mainAnswer = parts;
                    const followUps = parts ? parts.split('|') : ["और विस्तार से बताएं"];

                    const newBlock = document.createElement('div');
                    newBlock.className = "stream-card";
                    
                    const uniqueIdText = "txt_" + Date.now();
                    const uniqueIdRes = "res_" + Date.now();

                    let blockHtml = `
                        <h4 style="color: #2563eb; margin-bottom: 12px; font-size: 15px; font-weight:bold;">Query: ${query}</h4>
                        <div style="font-size: 15px; line-height: 1.6; color: #1e293b; white-space: pre-wrap; margin-bottom: 15px;">${mainAnswer}</div>`;

                    // 🎛️ जादुई यूनिक सैंडबॉक्स विजेट का ऑटोमैटिक जुड़ना (The Game Changer!)
                    blockHtml += `
                        <div class="interactive-sandbox">
