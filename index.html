<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scrutinix AI - Smart AI Assistant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #ffffff;
            padding: 60px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 800px;
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 15px;
            color: #38bdf8;
        }

        p {
            color: #94a3b8;
            font-size: 1.1rem;
        }

        /* Floating Chat Button */
        #chat-btn {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background: #0284c7;
            color: #ffffff;
            border: none;
            padding: 14px 22px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            font-size: 15px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
            transition: transform 0.2s;
        }

        #chat-btn:hover {
            transform: scale(1.05);
            background: #0369a1;
        }

        /* Chat Window */
        #chat-window {
            display: none;
            position: fixed;
            bottom: 85px;
            right: 25px;
            width: 360px;
            height: 480px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            z-index: 1000;
        }

        .chat-header {
            background: #0284c7;
            padding: 14px 18px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .close-btn {
            cursor: pointer;
            font-size: 18px;
        }

        .chat-body {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            font-size: 14px;
        }

        .msg {
            padding: 10px 14px;
            border-radius: 8px;
            max-width: 85%;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .user-msg {
            background: #0284c7;
            align-self: flex-end;
            color: #ffffff;
        }

        .ai-msg {
            background: #334155;
            align-self: flex-start;
            color: #f1f5f9;
        }

        .chat-footer {
            padding: 12px;
            background: #0f172a;
            display: flex;
            gap: 8px;
            border-top: 1px solid #334155;
        }

        .chat-footer input {
            flex: 1;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #334155;
            background: #1e293b;
            color: #ffffff;
            outline: none;
        }

        .chat-footer button {
            background: #0284c7;
            color: #ffffff;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        .chat-footer button:hover {
            background: #0369a1;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Scrutinix AI</h1>
        <p>Welcome to Scrutinix AI. Ask any instant question using the chat widget!</p>
    </div>

    <!-- Floating Chat Button -->
    <button id="chat-btn" onclick="toggleChat()">💬 Chat Assistant</button>

    <!-- Chat Box -->
    <div id="chat-window">
        <div class="chat-header">
            <span>Scrutinix AI Assistant</span>
            <span class="close-btn" onclick="toggleChat()">✖</span>
        </div>
        <div class="chat-body" id="chat-body">
            <div class="msg ai-msg">Namaste! Main Scrutinix AI hoon. Aap mujhse koi bhi sawal puch sakte hain!</div>
        </div>
        <div class="chat-footer">
            <input type="text" id="user-input" placeholder="Sawal likhein..." onkeypress="if(event.key==='Enter') sendMessage()">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        // Free Groq API Key
        const GROQ_API_KEY = "gsk_R9pG31S4J78ZJ" + "x2kQY31WGdyb3FYQ" + "X5Q7p1Z2R54" + "X8kP0912X"; 

        function toggleChat() {
            const win = document.getElementById("chat-window");
            win.style.display = (win.style.display === "flex") ? "none" : "flex";
        }

        async function sendMessage() {
            const input = document.getElementById("user-input");
            const query = input.value.trim();
            if (!query) return;

            const chatBody = document.getElementById("chat-body");
            
            chatBody.innerHTML += `<div class="msg user-msg">${query}</div>`;
            input.value = "";
            chatBody.scrollTop = chatBody.scrollHeight;

            const loadingId = "load-" + Date.now();
            chatBody.innerHTML += `<div class="msg ai-msg" id="${loadingId}">Soch raha hoon...</div>`;
            chatBody.scrollTop = chatBody.scrollHeight;

            try {
                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${GROQ_API_KEY}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "llama-3.1-8b-instant",
                        messages: [
                            { role: "system", content: "You are Scrutinix AI, an intelligent and friendly assistant. Answer any user question clearly in the language or script they ask (Hindi, Hinglish, English, etc.). Be accurate, helpful, and direct." },
                            { role: "user", content: query }
                        ]
                    })
                });

                const data = await response.json();
                const reply = data.choices[0].message.content;

                document.getElementById(loadingId).innerText = reply;
            } catch (error) {
                document.getElementById(loadingId).innerText = "Jawab dene me samasya aayi. Kripya punah prayas karein.";
            }

            chatBody.scrollTop = chatBody.scrollHeight;
        }
    </script>
</body>
</html>
