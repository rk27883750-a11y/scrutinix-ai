<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scrutinix AI Store</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background-color: #0f172a; color: #fff; padding: 20px; }
        
        .products-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; max-width: 1000px; margin: 40px auto; }
        .product-card { background: #1e293b; border: 1px solid #334155; padding: 15px; border-radius: 10px; text-align: center; }
        .product-card h3 { margin: 10px 0; color: #38bdf8; }
        .price { font-weight: bold; font-size: 1.2rem; margin-bottom: 10px; color: #4ade80; }
        .add-btn { background: #0284c7; color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; }
        .add-btn:hover { background: #0369a1; }

        /* Floating Cart Icon */
        #cart-icon-btn { position: fixed; top: 20px; right: 20px; background: #0284c7; color: white; border: none; padding: 12px 18px; border-radius: 30px; cursor: pointer; font-weight: bold; z-index: 100; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        #cart-count { background: #ef4444; padding: 2px 8px; border-radius: 50%; font-size: 12px; margin-left: 5px; }

        /* Cart Sidebar Drawer */
        #cart-sidebar { display: none; position: fixed; top: 0; right: 0; width: 320px; height: 100%; background: #1e293b; border-left: 1px solid #334155; padding: 20px; flex-direction: column; z-index: 1000; box-shadow: -5px 0 15px rgba(0,0,0,0.5); }
        .cart-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 10px; }
        .cart-items { flex: 1; overflow-y: auto; margin-top: 15px; display: flex; flex-direction: column; gap: 10px; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; background: #0f172a; padding: 10px; border-radius: 6px; }
        .remove-btn { background: #ef4444; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 12px; }
        .cart-footer { border-top: 1px solid #334155; padding-top: 15px; margin-top: 10px; }
        .checkout-btn { background: #22c55e; color: white; border: none; padding: 12px; border-radius: 6px; width: 100%; font-weight: bold; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>

    <!-- Floating Cart Button -->
    <button id="cart-icon-btn" onclick="toggleCartDrawer()">🛒 Cart <span id="cart-count">0</span></button>

    <!-- Product Showcase -->
    <div class="products-grid">
        <div class="product-card">
            <h3>AI Prompt eBook</h3>
            <div class="price">₹199</div>
            <button class="add-btn" onclick="addToCart('AI Prompt eBook', 199)">Add to Cart</button>
        </div>
        <div class="product-card">
            <h3>SEO Audit Tool</h3>
            <div class="price">₹499</div>
            <button class="add-btn" onclick="addToCart('SEO Audit Tool', 499)">Add to Cart</button>
        </div>
    </div>

    <!-- Cart Sidebar Modal -->
    <div id="cart-sidebar">
        <div class="cart-header">
            <h3>Your Cart</h3>
            <span style="cursor:pointer;" onclick="toggleCartDrawer()">✖</span>
        </div>
        <div class="cart-items" id="cart-items-container">
            <p style="color:#94a3b8; text-align:center;">Cart is empty</p>
        </div>
        <div class="cart-footer">
            <div style="display:flex; justify-content:space-between; font-weight:bold;">
                <span>Total Amount:</span>
                <span id="cart-total">₹0</span>
            </div>
            <button class="checkout-btn" onclick="proceedToCheckout()">Checkout / Buy Now</button>
        </div>
    </div>

    <script>
        let cart = [];

        function toggleCartDrawer() {
            const drawer = document.getElementById('cart-sidebar');
            drawer.style.display = drawer.style.display === 'flex' ? 'none' : 'flex';
        }

        function addToCart(name, price) {
            cart.push({ id: Date.now(), name: name, price: price });
            updateCartUI();
            toggleCartDrawer();
        }

        function removeFromCart(id) {
            cart = cart.filter(item => item.id !== id);
            updateCartUI();
        }

        function updateCartUI() {
            const container = document.getElementById('cart-items-container');
            const countEl = document.getElementById('cart-count');
            const totalEl = document.getElementById('cart-total');

            countEl.innerText = cart.length;

            if (cart.length === 0) {
                container.innerHTML = '<p style="color:#94a3b8; text-align:center;">Cart is empty</p>';
                totalEl.innerText = '₹0';
                return;
            }

            let html = '';
            let total = 0;

            cart.forEach(item => {
                total += item.price;
                html += `
                    <div class="cart-item">
                        <div>
                            <div style="font-weight:bold;">${item.name}</div>
                            <div style="color:#4ade80; font-size:13px;">₹${item.price}</div>
                        </div>
                        <button class="remove-btn" onclick="removeFromCart(${item.id})">Remove</button>
                    </div>
                `;
            });

            container.innerHTML = html;
            totalEl.innerText = '₹' + total;
        }

        function proceedToCheckout() {
            if (cart.length === 0) {
                alert("Aapka cart khali hai!");
                return;
            }
            // Payment Gateway link ya redirect logic yahan aayega
            alert("Redirecting to Payment Gateway...");
        }
    </script>
</body>
</html>
