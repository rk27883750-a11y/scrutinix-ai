<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scrutinix AI - Autonomous UI & Design Tokens Infrastructure</title>
    <style>
        :root {
            --bg-main: #060913;
            --bg-card: #0f172a;
            --bg-input: #020617;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-cyan: #38bdf8;
            --accent-green: #22c55e;
            --accent-pink: #ec4899;
            --border-color: #1e293b;
            --neon-glow: 0 0 20px rgba(56, 189, 248, 0.15);
        }
        
        html { scroll-behavior: smooth; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-main); color: var(--text-main); margin: 0; padding: 0; display: flex; flex-direction: column; min-height: 100vh; }
        
        /* Premium Header Navigation */
        header { display: flex; justify-content: space-between; align-items: center; padding: 20px 50px; border-bottom: 1px solid var(--border-color); background: #0b0f19; position: sticky; top: 0; z-index: 1000; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
        .logo-text { font-size: 24px; font-weight: 800; color: var(--text-main); letter-spacing: 1.5px; }
        .logo-text span { color: var(--accent-cyan); }
        nav { display: flex; gap: 35px; align-items: center; }
        nav a { color: var(--text-muted); text-decoration: none; font-size: 14px; font-weight: 600; transition: 0.3s; }
        nav a:hover { color: var(--accent-cyan); }
        .launch-btn { background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%); color: #060913; font-size: 13px; font-weight: 700; padding: 10px 22px; border-radius: 8px; text-decoration: none; transition: 0.3s; box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3); }
        .launch-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(56, 189, 248, 0.5); }
        
        /* Hero Section Styling */
        .hero-section { max-width: 1200px; margin: 60px auto 40px auto; padding: 0 30px; text-align: center; }
        .hero-section h1 { font-size: 46px; font-weight: 800; color: var(--text-main); margin-bottom: 20px; line-height: 1.2; letter-spacing: -0.5px; }
        .hero-section h1 span.cyan { color: var(--accent-cyan); }
        .hero-section h1 span.pink { color: var(--accent-pink); }
        .hero-section p { color: var(--text-muted); font-size: 18px; max-width: 850px; margin: 0 auto 50px auto; line-height: 1.6; }
        
        /* Advanced SaaS Grid Layout (Screen Layout Replica) */
        .dashboard-grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 25px; margin-bottom: 50px; }
        
        .widget-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px; padding: 30px; position: relative; transition: all 0.3s ease; box-shadow: var(--neon-glow); }
        .widget-card:hover { transform: translateY(-5px); border-color: var(--accent-cyan); box-shadow: 0 10px 30px rgba(56, 189, 248, 0.15); }
        
        .widget-card h3 { color: #ffffff; margin-top: 0; margin-bottom: 15px; font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
        .widget-card p { font-size: 14px; color: var(--text-muted); line-height: 1.6; margin: 0 0 20px 0; }
        
        /* Custom Neon Tag Labels */
        .tag-badge { font-size: 10px; font-weight: 700; padding: 4px 10px; border-radius: 20px; text-transform: uppercase; display: inline-block; position: absolute; top: 25px; right: 25px; }
        .tag-cyan { background: rgba(56, 189, 248, 0.1); color: var(--accent-cyan); border: 1px solid var(--accent-cyan); }
        .tag-pink { background: rgba(236, 72, 153, 0.1); color: var(--accent-pink); border: 1px solid var(--accent-pink); }
        
        /* Specific Grid Assignments for High-End Layout */
        .w-col-6-left { grid-column: span 4; }
        .w-col-6-right { grid-column: span 4; }
        .w-center-preview { grid-column: span 4; display: flex; flex-direction: column; justify-content: center; align-items: center; background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%); border: 2px solid var(--border-color); }
        .full-width-card { grid-column: span 12; background: linear-gradient(135deg, #0f172a 0%, #030712 100%); border: 1px dashed var(--accent-cyan); }
        
        /* Simulated Dynamic Component Preview Inside Center Box */
        .mock-ui-preview { width: 100%; border: 1px solid var(--border-color); background: var(--bg-input); border-radius: 8px; padding: 15px; box-sizing: border-box; font-family: monospace; font-size: 11px; color: var(--accent-cyan); }
        
        .main-cta { background: linear-gradient(135deg, #38bdf8 0%, #ec4899 100%); color: #ffffff; font-size: 18px; font-weight: 700; padding: 16px 44px; border: none; border-radius: 10px; cursor: pointer; text-decoration: none; display: inline-block; transition: 0.3s; box-shadow: 0 4px 20px rgba(236, 72, 153, 0.3); }
        .main-cta:hover { transform: scale(1.03); box-shadow: 0 6px 25px rgba(236, 72, 153, 0.5); }
        
        /* Form Workspace Styling */
        .workspace-section { padding: 80px 20px; border-top: 1px solid var(--border-color); background: #090d16; }
        .form-container { max-width: 800px; margin: 0 auto; background: var(--bg-card); padding: 40px; border-radius: 20px; border: 1px solid var(--border-color); box-shadow: var(--neon-glow); }
        .form-container h2 { font-size: 28px; font-weight: 800; margin-top: 0; color: #ffffff; }
        
        /* Form Inputs Layout */
        .form-group { margin-bottom: 20px; text-align: left; }
        label { font-weight: 600; color: #cbd5e1; display: block; margin-bottom: 8px; font-size: 14px; }
        input, select, textarea { width: 100%; padding: 14px; background: var(--bg-input); color: #f8fafc; border: 1px solid #334155; border-radius: 10px; box-sizing: border-box; font-size: 14px; transition: 0.3s; }
        input:focus, select:focus, textarea:focus { border-color: var(--accent-cyan); outline: none; box-shadow: 0 0 10px rgba(56, 189, 248, 0.2); }
        
        button.gen-btn { background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%); color: #060913; border: none; padding: 16px; width: 100%; border-radius: 10px; font-size: 16px; font-weight: 700; cursor: pointer; transition: 0.3s; margin-top: 25px; box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3); }
        button.gen-btn:hover { background: #7dd3fc; transform: translateY(-2px); box-shadow: 0 6px 20px rgba(56, 189, 248, 0.5); }
        
        /* Outputs & Tabs Layout */
        .result-box { margin-top: 35px; padding: 25px; border-radius: 12px; display: none; background: var(--bg-input); border: 1px solid #334155; text-align: left; }
        .tab-container { display: flex; gap: 12px; margin-bottom: 15px; }
        .tab { background: #1e293b; color: #94a3b8; padding: 10px 20px; border-radius: 8px; cursor: pointer; border: 1px solid #334155; font-size: 13px; font-weight: 700; transition: 0.3s; }
        .tab.active { background: var(--accent-cyan); color: #060913; border-color: var(--accent-cyan); }
        pre { background: #020617; padding: 20px; border-radius: 8px; border: 1px solid #1e293b; color: #4ade80; overflow-x: auto; font-family: 'Courier New', Courier, monospace; font-size: 13px; line-height: 1.6; margin: 0; }
        
        /* Export Buttons Tier */
        .export-actions { display: flex; gap: 15px; margin-top: 25px; flex-wrap: wrap; }
        .exp-btn { background-color: #1e293b; color: var(--accent-cyan); border: 1px solid var(--accent-cyan); padding: 12px 22px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 700; transition: 0.3s; flex: 1; min-width: 160px; }
        .exp-btn:hover { background-color: var(--accent-cyan); color: #060913; }
        .pdf-btn { background-color: var(--accent-green) !important; color: white !important; border: none !important; box-shadow: 0 4px 15px rgba(34, 197, 94, 0.3); }
        .pdf-btn:hover { background-color: #16a34a !important; box-shadow: 0 6px 20px rgba(34, 197, 94, 0.5); }
        
        /* Pricing Component Layout */
        .pricing-section { padding: 80px 20px; text-align: center; border-top: 1px solid var(--border-color); background: #0b0f19; }
        .pricing-container { display: flex; justify-content: center; gap: 40px; margin-top: 40px; flex-wrap: wrap; }
        .price-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 20px; padding: 40px; width: 280px; text-align: center; position: relative; box-shadow: var(--neon-glow); }
        .price-card.premium { border: 2px solid var(--accent-cyan); }
        .price-card h3 { color: #ffffff; margin-top: 0; font-size: 22px; }
        .price { font-size: 42px; font-weight: 800; color: var(--accent-cyan); margin: 20px 0; }
        .price-btn { background: transparent; color: var(--accent-cyan); border: 1px solid var(--accent-cyan); padding: 12px 28px; border-radius: 8px; font-weight: 700; cursor: pointer; text-decoration: none; display: inline-block; width: 85%; margin-top: 20px; transition: 0.3s; }
        .price-card.premium .price-btn { background: var(--accent-cyan); color: #060913; box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3); }
        .price-btn:hover { transform: translateY(-2px); }
        
        footer { text-align: center; padding: 40px; font-size: 12px; color: #64748b; border-top: 1px solid var(--border-color); background: #060913; }
    </style>
</head>
<body>

    <!-- Header Navigation Section -->
    <header>
        <div class="logo-text">SCRUTINIX <span>AI</span></div>
        <nav>
            <a href="#features">Features</a>
            <a href="#pricing">Pricing</a>
            <a href="#workspace" class="launch-btn">Launch Generator ➔</a>
        </nav>
    </header>
