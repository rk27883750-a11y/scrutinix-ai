<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scrutinix AI - Visual Research Studio</title>
  
  <!-- Vis.js Library for 3D/Interactive Graph -->
  <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>

  <style>
    :root {
      --bg-color: #0b1120;
      --card-bg: #1e293b;
      --accent-color: #38bdf8;
      --text-color: #f8fafc;
      --text-secondary: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-color); padding: 20px; min-height: 100vh; }

    header { text-align: center; margin-bottom: 25px; }
    header h1 { font-size: 2.2rem; color: var(--accent-color); letter-spacing: 1px; }
    header p { color: var(--text-secondary); font-size: 0.95rem; margin-top: 5px; }

    /* Search Box */
    .search-container { max-width: 800px; margin: 0 auto 25px auto; display: flex; gap: 10px; }
    .search-input { flex: 1; padding: 14px 18px; border-radius: 8px; border: 1px solid #334155; background: var(--card-bg); color: #fff; font-size: 1rem; outline: none; }
    .search-input:focus { border-color: var(--accent-color); }
    .btn-search { padding: 14px 28px; background: var(--accent-color); border: none; border-radius: 8px; color: #0f172a; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .btn-search:hover { opacity: 0.9; }

    /* Main Grid Layout */
    .main-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; max-width: 1200px; margin: 0 auto; }
    @media (max-width: 850px) { .main-grid { grid-template-columns: 1fr; } }

    .panel { background: var(--card-bg); border-radius: 12px; border: 1px solid #334155; padding: 20px; display: flex; flex-direction: column; }
    .panel-title { font-size: 1.1rem; color: var(--accent-color); margin-bottom: 15px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }

    /* Feature 1: Graph Container */
    #network-graph { width: 100%; height: 320px; background-color: #070a13; border-radius: 8px; border: 1px solid #334155; }

    /* Feature 2: Time-Travel Slider */
    .slider-box { margin-top: 15px; background: #0f172a; padding: 12px; border-radius: 8px; border: 1px solid #334155; }
    .slider-box label { font-size: 0.85rem; color: var(--text-secondary); display: block; margin-bottom: 8px; }
    .timeline-slider { width: 100%; accent-color: var(--accent-color); cursor: pointer; }
    .year-display { text-align: center; font-weight: bold; color: var(--accent-color); margin-top: 5px; }

    /* Feature 3: Interactive Study Flashcards */
    .flashcards-container { display: flex; flex-direction: column; gap: 15px; height: 390px; overflow-y: auto; padding-right: 5px; }
    
    .flashcard { perspective: 1000px; height: 110px; cursor: pointer; }
    .flashcard-inner { position: relative; width: 100%; height: 100%; text-align: center; transition: transform 0.6s; transform-style: preserve-3d; border-radius: 8px; }
    .flashcard:hover .flashcard-inner, .flashcard.flipped .flashcard-inner { transform: rotateY(180deg); }
    
    .card-front, .card-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; align-items: center; justify-content: center; border-radius: 8px; padding: 12px; font-size: 0.95rem; }
    .card-front { background-color: #0f172a; border: 1px solid #38bdf8; color: var(--accent-color); font-weight: bold; }
    .card-back { background-color: #38bdf8; color: #0f172a; font-weight: 600; transform: rotateY(180deg); }
  </style>
</head>
<body>

  <header>
    <h1>Scrutinix AI</h1>
    <p>3D Brain Graph • Time Slider • Study Flashcards</p>
  </header>

  <!-- Search Area -->
  <div class="search-container">
    <input type="text" id="searchInput" class="search-input" placeholder="Topic type karein (Jaise: AI, Web Development, History)...">
    <button onclick="runScrutinix()" class="btn-search">Scrutinize</button>
  </div>

  <!-- Dashboard Layout -->
  <div class="main-grid">
    
    <!-- Left Column: Interactive Graph & Time Slider -->
    <div class="panel">
      <div class="panel-title"><span>Interactive Brain-Graph</span> <small style="font-size: 0.75rem; color: #94a3b8;">(Zoom/Drag nodes)</small></div>
      <div id="network-graph"></div>

      <!-- Feature 2: Time-Travel Slider -->
      <div class="slider-box">
        <label for="timeline">Time-Travel Slider (Timeline Explorer):</label>
        <input type="range" id="timeline" class="timeline-slider" min="2000" max="2026" value="2026" oninput="updateTimeline(this.value)">
        <div class="year-display">Selected Era: <span id="yearVal">2026</span></div>
      </div>
    </div>

    <!-- Right Column: Interactive Study Flashcards -->
    <div class="panel">
      <div class="panel-title"><span>Study Flashcards</span> <small style="font-size: 0.75rem; color: #94a3b8;">(Hover/Tap to flip)</small></div>
      <div id="flashcardsBox" class="flashcards-container">
        <div class="flashcard">
          <div class="flashcard-inner">
            <div class="card-front">Q: Scrutinix AI kaise kaam karta hai?</div>
            <div class="card-back">A: Yeh bina API ke direct browser par visual mind-map aur flashcards banata hai.</div>
          </div>
        </div>
      </div>
    </div>

  </div>

  <script>
    let network = null;

    function runScrutinix() {
      const topic = document.getElementById('searchInput').value.trim() || "Research Topic";

      // 1. Generate 3D Style Interactive Graph
      const nodes = new vis.DataSet([
        { id: 1, label: topic, shape: 'dot', size: 25, color: '#38bdf8', font: { color: '#fff', size: 16 } },
        { id: 2, label: 'Core Fundamentals', shape: 'dot', size: 15, color: '#34d399' },
        { id: 3, label: 'Advanced Features', shape: 'dot', size: 15, color: '#fbbf24' },
        { id: 4, label: 'Practical Uses', shape: 'dot', size: 15, color: '#a78bfa' },
        { id: 5, label: 'Tools & Ecosystem', shape: 'dot', size: 10, color: '#94a3b8' }
      ]);

      const edges = new vis.DataSet([
        { from: 1, to: 2, color: { color: '#334155' } },
        { from: 1, to: 3, color: { color: '#334155' } },
        { from: 1, to: 4, color: { color: '#334155' } },
        { from: 2, to: 5, color: { color: '#334155' } }
      ]);

      const container = document.getElementById('network-graph');
      const data = { nodes: nodes, edges: edges };
      const options = {
        nodes: { borderWidth: 2 },
        physics: { stabilization: false, barnesHut: { springLength: 100 } }
      };

      network = new vis.Network(container, data, options);

      // 2. Generate Flashcards Dynamic Content
      const flashcardsBox = document.getElementById('flashcardsBox');
      flashcardsBox.innerHTML = `
        <div class="flashcard" onclick="this.classList.toggle('flipped')">
          <div class="flashcard-inner">
            <div class="card-front">Q: ${topic} Ka Mukhya Concept Kya Hai?</div>
            <div class="card-back">A: Yeh topic ke basic principles aur structure ko darshata hai.</div>
          </div>
        </div>
        <div class="flashcard" onclick="this.classList.toggle('flipped')">
          <div class="flashcard-inner">
            <div class="card-front">Q: ${topic} Ka Practical Application?</div>
            <div class="card-back">A: Iska upyog problem solving aur project development mein hota hai.</div>
          </div>
        </div>
        <div class="flashcard" onclick="this.classList.toggle('flipped')">
          <div class="flashcard-inner">
            <div class="card-front">Q: ${topic} Ke Liye Best Tools?</div>
            <div class="card-back">A: Standard open-source libraries aur modern frameworks.</div>
          </div>
        </div>
      `;
    }

    // Time-Travel Slider Handler
    function updateTimeline(year) {
      document.getElementById('yearVal').innerText = year;
    }

    // Initial Load
    window.onload = runScrutinix;
  </script>
</body>
</html>
