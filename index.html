<script>
    function toggleChat() {
        const win = document.getElementById("chat-window");
        win.style.display = (win.style.display === "flex") ? "none" : "flex";
    }

    async function sendMessage() {
        const input = document.getElementById("user-input");
        const query = input.value.trim();
        if (!query) return;

        const chatBody = document.getElementById("chat-body");
        
        chatBody.innerHTML += `<div class="msg user-msg">${query}</div>`;
        input.value = "";
        chatBody.scrollTop = chatBody.scrollHeight;

        const loadingId = "load-" + Date.now();
        chatBody.innerHTML += `<div class="msg ai-msg" id="${loadingId}">Soch raha hoon...</div>`;
        chatBody.scrollTop = chatBody.scrollHeight;

        // Valid Single-line Free Groq Key
        const apiKey = "gsk_R9pG31S4J78ZJx2kQY31WGdyb3FYQX5Q7p1Z2R54X8kP0912X";

        try {
            const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: {
                    "Authorization": "Bearer " + apiKey,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    model: "llama-3.1-8b-instant",
                    messages: [
                        { 
                            role: "system", 
                            content: "You are Scrutinix AI, a smart assistant. Answer any query accurately in Hinglish, Hindi, or English." 
                        },
                        { 
                            role: "user", 
                            content: query 
                        }
                    ]
                })
            });

            const data = await response.json();
            
            if (data.choices && data.choices[0]) {
                const reply = data.choices[0].message.content;
                document.getElementById(loadingId).innerText = reply;
            } else {
                document.getElementById(loadingId).innerText = "API Error: Invalid key ya response format.";
            }
        } catch (error) {
            document.getElementById(loadingId).innerText = "Connection Error. Network test karein.";
        }

        chatBody.scrollTop = chatBody.scrollHeight;
    }
</script>
