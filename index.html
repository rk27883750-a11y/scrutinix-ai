<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scrutinix AI | Intelligent Insights. Smarter Decisions.</title>
    <style>
        /* 🎨 प्रीमियम ग्लोबल टेक थीम - डार्क नियॉन लुक */
        body {
            background-color: #030813; /* गहरा प्रीमियम डार्क बैकग्राउंड */
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            text-align: center;
            -webkit-font-smoothing: antialiased;
        }
        
        .container {
            max-width: 950px;
            margin: 0 auto;
            padding: 20px;
        }

        /* 🌐 ⚡ प्रोफेशनल नेविगेशन और ड्रॉप-डाउन मेनू बार (Hooray!) */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid #0f1e33;
            position: relative;
        }
        .logo {
            font-size: 22px;
            font-weight: 800;
            color: #ffffff;
            text-decoration: none;
            letter-spacing: 0.5px;
        }
        .nav-links {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        /* 📦 ड्रॉप-डाउन बटन का मुख्य ढांचा */
        .dropdown {
            position: relative;
            display: inline-block;
        }
        .dropbtn {
            background-color: #061224;
            color: #ffffff;
            padding: 10px 18px;
            font-size: 14px;
            font-weight: 600;
            border: 1px solid #132742;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.2s ease;
        }
        .dropdown:hover .dropbtn {
            border-color: #00d2ff;
            color: #00d2ff;
        }
        
        /* 📋 नीचे खुलने वाले ऑप्शंस की लिस्ट बॉक्स (Hidden by Default) */
        .dropdown-content {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            background-color: #061224;
            min-width: 220px;
            box-shadow: 0px 8px 25px rgba(0,0,0,0.6);
            border: 1px solid #132742;
            border-radius: 8px;
            z-index: 1000;
            margin-top: 5px;
            text-align: left;
            overflow: hidden;
        }
        /* माउस ले जाने पर लिस्ट को दिखाना */
        .dropdown:hover .dropdown-content {
            display: block;
        }
        /* लिस्ट के अंदर के लिंक्स/ऑप्शंस */
        .dropdown-content a {
            color: #cbd5e1;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
            font-size: 13.5px;
            font-weight: 500;
            transition: 0.2s ease;
            border-bottom: 1px solid #0f1e33;
        }
        .dropdown-content a:last-child {
            border-bottom: none;
        }
        .dropdown-content a:hover {
            background-color: #132742;
            color: #00d2ff;
            padding-left: 20px; /* हल्का सा सरकने वाला एनीमेशन */
        }

        /* 🚀 मुख्य हेडिंग एरिया */
        .hero {
            padding: 60px 10px 20px 10px;
        }
        .hero h1 {
            font-size: 38px;
            font-weight: 800;
            margin-bottom: 12px;
            color: #ffffff;
            letter-spacing: -0.5px;
        }
        .hero h1 span {
            background: linear-gradient(45deg, #00d2ff, #6c5ce7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .hero p {
            font-size: 16px;
            color: #cbd5e1;
            max-width: 580px;
            margin: 0 auto 25px auto;
            line-height: 1.6;
            font-weight: 500;
        }

        /* 📥 "Download Free Tools" बटन */
        .download-btn {
            background: linear-gradient(45deg, #00d2ff, #00a8ff);
            color: #030813;
            border: none;
            padding: 12px 30px;
            border-radius: 6px;
            font-size: 14.5px;
            font-weight: 700;
            cursor: pointer;
            margin-bottom: 45px;
            box-shadow: 0 4px 20px rgba(0, 210, 255, 0.3);
            transition: all 0.3s ease;
        }
        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(0, 210, 255, 0.5);
            background: #ffffff;
            color: #030813;
        }

        /* 💰 Our Pricing Plans हेडिंग */
        .pricing-title {
            font-size: 20px;
            font-weight: 700;
            margin: 10px 0 20px 0;
            color: #ffffff;
            letter-spacing: 0.5px;
        }

        /* 💳 फ्री और पेड बॉक्स डिज़ाइन */
        .pricing-grid {
            display: flex;
            gap: 25px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 45px;
        }
        .price-card {
            background: linear-gradient(145deg, #061224, #040d1a);
            border: 1px solid #132742;
            border-radius: 12px;
            padding: 25px;
            flex: 1;
            max-width: 330px;
            min-width: 270px;
            text-align: left;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .price-card:hover {
            transform: translateY(-4px);
            border-color: #00d2ff;
            box-shadow: 0 15px 35px rgba(0, 210, 255, 0.1);
        }
        .price-card.premium {
            border: 1px solid #483b8a;
            box-shadow: 0 10px 30px rgba(108, 92, 231, 0.1);
        }
        .price-card.premium:hover {
            border-color: #6c5ce7;
            box-shadow: 0 15px 35px rgba(108, 92, 231, 0.2);
        }
        .price-card h4 {
            font-size: 13px;
            color: #94a3b8;
            margin: 0 0 8px 0;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
        }
        .price-card.premium h4 {
            color: #a29bfe;
        }
        .price-amt {
            font-size: 28px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 18px;
        }
        .price-amt span {
            font-size: 12px;
            color: #64748b;
        }
        .price-card ul {
            list-style: none;
            padding: 0;
            margin: 0 0 25px 0;
        }
        .price-card ul li {
            font-size: 13.5px;
            color: #f1f5f9;
            margin-bottom: 8px;
            padding-left: 20px;
            position: relative;
            font-weight: 500;
        }
        .price-card ul li::before {
            content: "✓";
            position: absolute;
            left: 0;
            color: #00d2ff;
            font-weight: bold;
        }
        .price-card.premium ul li::before {
            color: #a29bfe;
        }
        .price-btn {
            width: 100%;
            padding: 11px;
            background: transparent;
            border: 1px solid #132742;
            color: #00d2ff;
            border-radius: 6px;
            font-size: 13.5px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .price-btn:hover {
            background-color: #00d2ff;
            color: #030813;
            border-color: #00d2ff;
        }
        .price-card.premium .price-btn {
            background: linear-gradient(45deg, #6c5ce7, #a29bfe);
            color: #ffffff;
            border: none;
            box-shadow: 0 4px 15px rgba(108, 92, 231, 0.3);
        }
        .price-card.premium .price-btn:hover {
            background: #ffffff;
            color: #030813;
            box-shadow: 0 6px 20px rgba(255, 255, 255, 0.4);
        }

        /* 📋 About Us / एडसेंस वैल्यू ब्लॉक */
        .info-content {
            background: linear-gradient(145deg, #040e1a, #020710);
            border-radius: 10px;
            padding: 25px 30px;
            margin-top: 30px;
            border: 1px dashed #132742;
            text-align: justify;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }
        .info-content h3 { color: #00d2ff; font-size: 16px; margin-bottom: 12px; text-align: center; font-weight: 700; letter-spacing: 0.5px; }
        .info-content p { color: #94a3b8; font-size: 13.5px; line-height: 1.7; margin: 0; font-weight: 500; }

        /* 📞 फुटर और कांटेक्ट डिटेल्स */
        .footer {
            margin-top: 50px;
            padding-top: 20px;
            border-top: 1px solid #0f1e33;
            color: #64748b;
            font-size: 13px;
        }
        .footer-links { margin-bottom: 12px; font-size: 13.5px; }
        .footer-links a { color: #00d2ff; text-decoration: none; margin: 0 8px; font-weight: bold; transition: 0.2s; }
        
        /* 🚨 पॉप-अप लीगल बॉक्स */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 1000; padding: 20px; }
        .modal-content { background: #050f1d; padding: 30px; border-radius: 10px; max-width: 450px; width: 100%; border: 1px solid #132742; text-align: left; box-shadow: 0 20px 40px rgba(0,0,0,0.6); }
        .modal h5 { font-size: 18px; color: #00d2ff; margin: 0 0 15px 0; font-weight: bold; text-align: center; }
        .modal p { font-size: 14px; color: #cbd5e1; margin-bottom: 20px; line-height: 1.6; }
        .modal-close-btn { background: #00d2ff; color: #030813; border: none; padding: 11px; border-radius: 4px; font-weight: bold; cursor: pointer; width: 100%; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
