<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scrutinix AI - Automation Builder</title>
  <style>
    body {
      background-color: #0b0f19;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .automation-box {
      width: 100%;
      max-width: 450px;
      padding: 30px;
      border: 2px solid #38bdf8;
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.2);
      border-radius: 16px;
      background: #111827;
    }
    .automation-box h3 {
      margin-top: 0;
      margin-bottom: 5px;
      font-size: 1.6rem;
      text-align: center;
      color: #38bdf8;
    }
    .automation-box p {
      color: #94a3b8;
      font-size: 0.85rem;
      text-align: center;
      margin-bottom: 25px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    .form-group label {
      display: block;
      font-size: 0.9rem;
      color: #cbd5e1;
      margin-bottom: 6px;
    }
    .form-group input, .form-group textarea {
      width: 100%;
      background: #0b0f19;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 8px;
      padding: 10px;
      color: white;
      font-size: 0.95rem;
      box-sizing: border-box;
    }
    .form-group input:focus, .form-group textarea:focus {
      border-color: #38bdf8;
      outline: none;
    }
    .btn-run {
      width: 100%;
      padding: 12px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 4px 10px rgba(0, 123, 255, 0.3);
      margin-top: 10px;
    }
    .btn-run:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>

  <div class="automation-box">
    <h3>⚡ Automation Builder</h3>
    <p>Fill out the details below to trigger your automation.</p>
    
    <form id="scrutinixForm">
      <div class="form-group">
        <label for="name">Name</label>
        <input type="text" id="name" placeholder="Enter your name" required>
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Enter your email" required>
      </div>
      <div class="form-group">
        <label for="website">Website</label>
        <input type="url" id="website" placeholder="https://yourwebsite.com" required>
      </div>
      <div class="form-group">
        <label for="requirement">Requirement</label>
        <textarea id="requirement" rows="4" placeholder="What do you want to automate?" required></textarea>
      </div>
      <button type="submit" class="btn-run">[ Run Automation ]</button>
    </form>
  </div>

  <script>
    document.getElementById('scrutinixForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      var webAppUrl = "https://google.com";
      
      // अब डेटा सीधे इनपुट बॉक्स से लिया जाएगा
      var formData = {
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        website: document.getElementById('website').value,
        requirement: document.getElementById('requirement').value
      };
      
      var btn = e.target.querySelector('.btn-run');
      btn.innerText = "Running...";
      btn.disabled = true;

      fetch(webAppUrl, {
        method: 'POST',
        mode: 'no-cors', 
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(formData)
      }).then(function() {
        alert('ऑटोमेशन सफलतापूर्वक रन हो गया! कृपया अपनी Google Sheet चेक करें।');
        document.getElementById('scrutinixForm').reset();
        btn.innerText = "[ Run Automation ]";
        btn.disabled = false;
      }).catch(function(err) {
        alert('त्रुटि हुई: ' + err);
        btn.innerText = "[ Run Automation ]";
        btn.disabled = false;
      });
    });
  </script>
</body>
</html>
