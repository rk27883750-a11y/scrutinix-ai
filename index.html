<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scrutinix AI // System Generator</title>
  <link href="https://googleapis.com" rel="stylesheet">
  <!-- html2pdf Library for PDF Generation -->
  <script src="https://cloudflare.com"></script>
  <style>
    :root {
      --bg-color: #0b0f17;
      --card-bg: #111827;
      --input-bg: #1f2937;
      --border-color: #374151;
      --accent-color: #00f2fe;
      --accent-hover: #00c6ff;
      --text-main: #f9fafb;
      --text-muted: #9ca3af;
      --code-bg: #030712;
      
      /* Dynamic Preview Variables */
      --preview-brand: #351156;
      --preview-radius: 8px;
      --preview-font: 'Roboto', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 28px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      position: relative;
    }

    .title-wrapper {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .title {
      color: var(--accent-color);
      font-size: 1.5rem;
      font-weight: 700;
    }

    /* ⭐ CLIENT VIEW TOGGLE BUTTON */
    .btn-toggle-view {
      padding: 6px 12px;
      background-color: #3b82f6;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-toggle-view:hover {
      background-color: #2563eb;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-row {
      display: flex;
      gap: 16px;
    }

    .form-row .form-group {
      flex: 1;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text-main);
    }

    input[type="text"], textarea, select {
      width: 100%;
      padding: 12px 14px;
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-main);
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus, textarea:focus, select:focus {
      border-color: var(--accent-color);
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background: linear-gradient(90deg, #00f2fe 0%, #4facfe 100%);
      border: none;
      border-radius: 8px;
      color: #000;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      transition: opacity 0.2s;
      margin-top: 10px;
    }

    .btn-submit:hover {
      opacity: 0.9;
    }

    .disclaimer {
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 12px;
    }

    /* ⭐ VISUAL THEME PLAYGROUND */
    .playground-box {
      margin-top: 20px;
      padding: 16px;
      background-color: #0d131f;
      border: 1px dashed var(--border-color);
      border-radius: 8px;
    }
    .playground-title {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 10px;
      text-transform: uppercase;
      font-weight: 700;
    }
    .preview-component {
      background-color: #1e293b;
      padding: 16px;
      border-radius: var(--preview-radius);
      font-family: var(--preview-font);
      transition: all 0.3s;
    }
    .preview-btn {
      background-color: var(--preview-brand);
      color: white;
      padding: 8px 16px;
      border: none;
      border-radius: var(--preview-radius);
      cursor: pointer;
      font-weight: 600;
    }

    /* Output Section */
    .output-section {
      display: none;
    }

    .output-header {
      color: var(--accent-color);
      font-weight: 600;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }

    .tab-btn {
      padding: 8px 16px;
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
    }

    .tab-btn.active {
      background-color: var(--accent-color);
      color: #000;
      border-color: var(--accent-color);
      font-weight: 600;
    }

    .code-container {
      background-color: var(--code-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 16px;
      overflow-x: auto;
      margin-bottom: 16px;
    }

    pre {
      font-family: 'Fira Code', monospace;
      font-size: 0.85rem;
      color: #38bdf8;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn-secondary {
      padding: 10px 16px;
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-secondary:hover {
      border-color: var(--accent-color);
    }

    /* Client Portal Hidden States */
    .client-hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- Top Section: Form -->
    <div class="card" id="formCard">
      <div class="title-wrapper">
        <h1 class="title" id="mainTitle">Scrutinix AI // System_Generator</h1>
        <!-- Client View Toggle Switch Button -->
        <button type="button" class="btn-toggle-view" id="viewToggleBtn" onclick="toggleClientMode()">👁️ Switch to Client View</button>
      </div>

      <form id="generatorForm">
        <div class="form-group">
          <label for="projectName">Project Name:</label>
          <input type="text" id="projectName" placeholder="e.g., grocery app" value="grocery app" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="brandColor">Brand Primary Color (HEX):</label>
            <input type="text" id="brandColor" oninput="updateLivePreview()" placeholder="e.g., #351156" value="#351156" required>
          </div>
          <div class="form-group">
            <label for="fontSelect">Select Typography Font:</label>
            <select id="fontSelect" onchange="updateLivePreview()">
              <option value="Roboto" selected>Roboto</option>
              <option value="Inter">Inter</option>
              <option value="Poppins">Poppins</option>
              <option value="Open Sans">Open Sans</option>
            </select>
          </div>
        </div>

        <div class="form-group (developer-only)" id="rulesContainer">
          <label for="customRules">Additional Layout / Component Rules:</label>
          <textarea id="customRules" placeholder="e.g., Custom configuration constraints, base-padding: 16px...">base-padding: 16px, border-radius-md: 8px</textarea>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">
          ⚡ GENERATE TOKENS & ARCHITECTURE
        </button>
      </form>

      <!-- ⭐ FEATURE 1: VISUAL THEME PLAYGROUND (क्लाइंट के लिए लाइव प्रीव्यू) -->
      <div class="playground-box">
        <div class="playground-title">🎨 Live Theme Playground</div>
        <div class="preview-component" id="previewComponent">
          <h3 style="margin-bottom: 8px; font-size: 1.1rem;" id="previewAppName">Grocery App UI</h3>
          <p style="font-size: 0.85rem; color: #9ca3af; margin-bottom: 12px;">This is a live component preview using your architecture.</p>
          <button class="preview-btn" id="previewBtn">Interactive Button</button>
        </div>
      </div>

      <div class="disclaimer">
        Disclaimer: Scrutinix AI provides automation utilities for developers
      </div>
    </div>

    <!-- Bottom Section: Generated Output -->
    <div class="card output-section" id="outputSection">
      <div class="output-header">
        ⚡ Generated Production-Ready Output
      </div>

      <div class="tabs" id="codeTabs">
        <button class="tab-btn active" id="tabCss" onclick="switchTab('css')">CSS Variables (:root)</button>
        <button class="tab-btn" id="tabTailwind" onclick="switchTab('tailwind')">Tailwind Config Extend</button>
      </div>

      <div class="code-container" id="pdfPrintArea">
        <pre><code id="codeOutput"></code></pre>
      </div>

      <div class="actions">
        <button class="btn-secondary (developer-only)" id="btnExpCss" onclick="downloadFile('css')">📥 Export variables.css</button>
        <button class="btn-secondary (developer-only)" id="btnExpTw" onclick="downloadFile('tailwind')">📥 Export tailwind.config.js</button>
        <button class="btn-secondary" onclick="downloadPdf()">📄 Export Spec PDF</button>
        <!-- ⭐ FEATURE 2: SHARE PORTAL LINKS & CHANGELOG -->
        <button class="btn-secondary" style="border-color: #3b82f6;" onclick="shareClientLink()">🔗 Share Client Link</button>
