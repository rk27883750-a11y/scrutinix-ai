<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scrutinix AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { display: flex; height: 100vh; background-color: #ffffff; color: #333; }
    .sidebar { width: 230px; background-color: #f8fafc; border-right: 1px solid #e2e8f0; padding: 20px 15px; display: flex; flex-direction: column; justify-content: space-between; }
    .brand-title { font-size: 20px; font-weight: 700; color: #0284c7; margin-bottom: 24px; }
    .btn-new-chat { width: 100%; background-color: #0284c7; color: white; border: none; padding: 10px 14px; border-radius: 8px; font-weight: 600; cursor: pointer; margin-bottom: 20px; }
    .main-content { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 60px 20px 40px 20px; overflow-y: auto; }
    .badge { background-color: #f0f9ff; color: #0284c7; border: 1px solid #bae6fd; padding: 4px 14px; border-radius: 20px; font-size: 12px; margin-bottom: 18px; }
    .hero-title { font-size: 36px; font-weight: 700; text-align: center; color: #0f172a; margin-bottom: 12px; }
    .hero-subtitle { font-size: 14px; color: #64748b; text-align: center; max-width: 650px; margin-bottom: 35px; }
    .search-box { width: 100%; max-width: 650px; display: flex; flex-direction: column; gap: 12px; }
    .search-input { width: 100%; padding: 14px 18px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px; outline: none; }
    .btn-search { width: 100%; background-color: #0284c7; color: white; border: none; padding: 13px; border-radius: 8px; font-weight: 600; font-size: 15px; cursor: pointer; }
    .result-container { width: 100%; max-width: 650px; margin-top: 25px; display: none; }
    .suggestion-box { background-color: #f8fafc; border-left: 3px solid #0284c7; padding: 16px 20px; border-radius: 6px; margin-bottom: 20px; }
    .suggestion-box ul { list-style-type: disc; padding-left: 20px; }
    .suggestion-box a { color: #0284c7; text-decoration: none; cursor: pointer; font-size: 14px; }
    .answer-box { font-size: 15px; line-height: 1.6; color: #1e293b; padding: 18px; background-color: #ffffff; border: 1px solid #e2e8f0; border-radius: 8px; white-space: pre-wrap; }
    .loading { color: #0284c7; font-weight: 600; }
  </style>
</head>
<body>

  <div class="sidebar">
    <div>
      <div class="brand-title">Scrutinix AI</div>
      <button class="btn-new-chat" onclick="resetSearch()">+ New Chat</button>
    </div>
    <div style="font-size:12px; color:#d97706;">⚡ Hugging Face Powered</div>
  </div>

  <div class="main-content">
    <div class="badge">✨ Real AI Engine</div>
    <h1 class="hero-title">AI Search is Changing.</h1>
    <h2 style="font-size: 22px; color: #0284c7; text-align: center; margin-bottom: 10px;">Discover Your True Visibility Index Instantly.</h2>
    <p class="hero-subtitle">Get direct, high-fidelity data evaluations on LLM citations and student employment indices.</p>

    <div class="search-box">
      <input type="text" id="searchInput" class="search-input" placeholder="Ask anything...">
      <button class="btn-search" onclick="runSearch()">Search Engine Engine</button>
    </div>

    <div id="resultContainer" class="result-container">
      <div class="suggestion-box">
        <div style="font-weight:600; margin-bottom:8px;">Are you looking for:</div>
        <ul id="suggestionList"></ul>
      </div>
      <div id="mainAnswer" class="answer-box"></div>
    </div>
  </div>

  <script>
    async function runSearch() {
      const query = document.getElementById("searchInput").value.trim();
      if (!query) return;

      const resultBox = document.getElementById("resultContainer");
      const answerBox = document.getElementById("mainAnswer");
      const listElement = document.getElementById("suggestionList");

      resultBox.style.display = "block";
      answerBox.innerHTML = '<span class="loading">Searching AI Engine... Please wait...</span>';

      listElement.innerHTML = `
        <li><a onclick="autoSearch('Overview of ${query}')">Overview of "${query}"</a></li>
        <li><a onclick="autoSearch('Detailed guide on ${query}')">Detailed guide on "${query}"</a></li>
      `;

      try {
        const response = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
        const data = await response.json();
        if (data.answer) {
          answerBox.innerText = data.answer;
        } else {
          answerBox.innerText = "Error: No response from AI.";
        }
      } catch (err) {
        answerBox.innerText = "Server error. Please try again in a few seconds.";
      }
    }

    function autoSearch(text) {
      document.getElementById("searchInput").value = text;
      runSearch();
    }

    function resetSearch() {
      document.getElementById("searchInput").value = "";
      document.getElementById("resultContainer").style.display = "none";
    }

    document.getElementById("searchInput").addEventListener("keypress", function(e) {
      if (e.key === "Enter") runSearch();
    });
  </script>
</body>
</html>
