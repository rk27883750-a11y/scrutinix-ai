<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scrutinix AI - Gemini Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .search-container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            width: 90%;
            max-width: 500px;
        }
        h2 {
            color: #222;
            margin-bottom: 20px;
            font-size: 24px;
        }
        input[type="text"] {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            border: 1px solid #ced4da;
            border-radius: 8px;
            box-sizing: border-box;
            margin-bottom: 15px;
            outline: none;
        }
        input[type="text"]:focus {
            border-color: #007bff;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 14px 24px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }
        button:hover {
            background-color: #0056b3;
        }
        #result {
            margin-top: 20px;
            padding: 15px;
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            text-align: left;
            white-space: pre-wrap;
            max-height: 250px;
            overflow-y: auto;
            display: none;
            color: #333;
        }
    </style>
</head>
<body>

<div class="search-container">
    <h2>What do you want to know?</h2>
    <input type="text" id="queryInput" placeholder="यहाँ अपना सवाल लिखें...">
    <button onclick="askGeminiAI()">Search</button>
    <div id="result"></div>
</div>

<script>
async function askGeminiAI() {
    const query = document.getElementById('queryInput').value;
    const resultDiv = document.getElementById('result');
    
    if (!query) {
        alert('कृपया पहले कुछ लिखें!');
        return;
    }

    resultDiv.style.display = "block";
    resultDiv.innerText = "सोच रहा हूँ...";

    try {
        const response = await fetch("/api/search", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ query: query })
        });

        const data = await response.json();
        
        // ✨ जेमिनी के डायरेक्ट रिस्पॉन्स को पढ़ने का नया तरीका
        if (data.candidates && data.candidates[0].content.parts[0].text) {
            resultDiv.innerText = data.candidates[0].content.parts[0].text;
        } else {
            resultDiv.innerText = "कोई जवाब नहीं मिला या चाबी में गड़बड़ है। " + JSON.stringify(data);
        }
    } catch (error) {
        console.error("Error:", error);
        resultDiv.innerText = "गड़बड़ हुई: " + error.message;
    }
}
</script>

</body>
</html>
