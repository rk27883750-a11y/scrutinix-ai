<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scrutinix AI Test</title>
  <style>
    body {
      background-color: #0b0f19;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .test-box {
      text-align: center;
      padding: 30px;
      border: 2px solid #38bdf8;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
      border-radius: 12px;
      background: #111827;
    }
    .btn-test {
      padding: 15px 30px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0, 123, 255, 0.4);
      transition: 0.2s;
    }
    .btn-test:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>

  <div class="test-box">
    <h2 style="margin-bottom: 20px;">⚡ Scrutinix AI Automation Test</h2>
    <p style="color: #94a3b8; margin-bottom: 25px;">नीचे दिए बटन पर क्लिक करके सीधे अपनी Google Sheet में डेटा भेजें।</p>
    
    <!-- टेस्ट करने का मुख्य बटन -->
    <button id="runBtn" class="btn-test">[ Run Automation ]</button>
  </div>

  <script>
    document.getElementById('runBtn').addEventListener('click', function() {
      // आपका लाइव Google Apps Script लिंक
      var webAppUrl = "https://google.com";
      
      // टेस्टिंग के लिए डमी डेटा (जो शीट में जाएगा)
      var testData = {
        name: "Rahul Test",
        email: "rk27883750@gmail.com",
        website: "scrutinixai.com",
        requirement: "Direct Testing from Live Button"
      };
      
      var btn = document.getElementById('runBtn');
      btn.innerText = "Running...";
      btn.disabled = true;

      fetch(webAppUrl, {
        method: 'POST',
        mode: 'no-cors', 
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(testData)
      }).then(function() {
        alert('बधाई हो! ऑटोमेशन रन हो गया है। कृपया अपनी Google Sheet चेक करें।');
        btn.innerText = "[ Run Automation ]";
        btn.disabled = false;
      }).catch(function(err) {
        alert('त्रुटि हुई: ' + err);
        btn.innerText = "[ Run Automation ]";
        btn.disabled = false;
      });
    });
  </script>
</body>
</html>
