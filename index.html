<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scrutinix AI</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .chat-container { width: 100%; max-width: 600px; height: 85vh; background-color: #1e293b; border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .chat-header { padding: 16px; background-color: #334155; text-align: center; font-weight: bold; font-size: 1.1rem; border-bottom: 1px solid #475569; }
        .chat-box { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .message { max-width: 80%; padding: 10px 14px; border-radius: 8px; line-height: 1.4; font-size: 0.95rem; word-break: break-word; }
        .user-message { align-self: flex-end; background-color: #2563eb; color: #fff; }
        .ai-message { align-self: flex-start; background-color: #475569; color: #fff; }
        .input-area { display: flex; padding: 12px; background-color: #334155; gap: 8px; }
        input[type="text"] { flex: 1; padding: 10px 14px; border: none; border-radius: 6px; background-color: #0f172a; color: #fff; outline: none; }
        button { padding: 10px 18px; border: none; border-radius: 6px; background-color: #2563eb; color: white; font-weight: bold; cursor: pointer; }
        button:disabled { background-color: #64748b; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">Scrutinix AI Assistant</div>
    <div class="chat-box" id="chatBox">
        <div class="message ai-message">नमस्ते! मैं Scrutinix AI हूँ। बताइए मैं आपकी क्या मदद करूँ?</div>
    </div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="अपना मैसेज लिखें..." onkeydown="if(event.key === 'Enter') sendMessage()">
        <button onclick="sendMessage()" id="sendBtn">Send</button>
    </div>
</div>

<script>
    async function sendMessage() {
        const inputField = document.getElementById("userInput");
        const sendBtn = document.getElementById("sendBtn");
        const chatBox = document.getElementById("chatBox");
        const prompt = inputField.value.trim();

        if (!prompt) return;

        appendMessage(prompt, "user-message");
        inputField.value = "";
        inputField.disabled = true;
        sendBtn.disabled = true;

        const loadingDiv = appendMessage("सोच रहा हूँ...", "ai-message");

        try {
            const response = await fetch("/api/generate", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ prompt: prompt })
            });

            const data = await response.json();
            loadingDiv.innerText = data.reply || "कोई उत्तर प्राप्त नहीं हुआ।";
        } catch (error) {
            loadingDiv.innerText = "एरर: सर्वर से कनेक्ट नहीं हो सका।";
        } finally {
            inputField.disabled = false;
            sendBtn.disabled = false;
            inputField.focus();
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    }

    function appendMessage(text, className) {
        const chatBox = document.getElementById("chatBox");
        const messageDiv = document.createElement("div");
        messageDiv.className = `message ${className}`;
        messageDiv.innerText = text;
        chatBox.appendChild(messageDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
        return messageDiv;
    }
</script>

</body>
</html>
