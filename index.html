<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intelligent Insights - AI Search & Pro Plans</title>
    
    <style>
        /* General Setup */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: #0b111e;
            color: #ffffff;
            padding: 60px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .hero-section {
            text-align: center;
            max-width: 750px;
            margin-bottom: 40px;
        }

        .top-heading {
            font-size: 2.8rem;
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 15px;
        }

        .cyan-text {
            color: #00e5ff;
        }

        /* TOP NAVIGATION BAR */
        .top-nav {
            display: flex;
            gap: 20px;
            margin-bottom: 40px;
            background: rgba(255, 255, 255, 0.03);
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .nav-item {
            font-size: 0.95rem;
            color: #94a3b8;
            cursor: pointer;
            transition: color 0.2s;
        }

        .upgrade-pro-link {
            color: #00e5ff !important;
            font-weight: 600;
        }

        /* 🆕 DOWNLOAD FREE TOOLS BUTTON STYLE */
        .primary-btn {
            background-color: #4cc9f0;
            color: #0b111e;
            border: none;
            padding: 14px 40px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(76, 201, 240, 0.4);
            margin: 20px 0 40px 0;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .primary-btn:hover {
            background-color: #00b4d8;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(76, 201, 240, 0.6);
        }

        /* AI SEARCH BOX */
        .search-section {
            width: 100%;
            max-width: 700px;
            margin-bottom: 60px;
        }

        .search-box-title {
            font-size: 2rem;
            font-weight: 600;
            margin-bottom: 20px;
            text-align: center;
        }

        .search-container {
            background-color: #111827;
            border: 1px solid #1f2937;
            border-radius: 16px;
            padding: 18px 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .search-input {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 1.15rem;
            margin-bottom: 15px;
        }

        .search-input::placeholder {
            color: #4b5563;
        }

        .search-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 12px;
        }

        .search-options {
            display: flex;
            gap: 15px;
            color: #94a3b8;
            font-size: 0.95rem;
        }

        /* PRICING SECTION */
        .pricing-section {
            width: 100%;
            max-width: 1000px;
            text-align: center;
            margin-top: 20px;
            display: none; /* शुरुआत में छिपा रहेगा */
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .pricing-section h2 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .pricing-section p {
            color: #94a3b8;
            margin-bottom: 25px;
        }

        /* Monthly / Yearly Toggle Button */
        .toggle-container {
            display: inline-flex;
            background-color: rgba(255, 255, 255, 0.04);
            padding: 4px;
            border-radius: 30px;
            margin-bottom: 45px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .toggle-btn {
            background: none;
            border: none;
            color: #94a3b8;
            padding: 8px 24px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            border-radius: 25px;
            transition: all 0.3s ease;
        }

        .toggle-btn.active {
            background-color: #ffffff;
            color: #0b111e;
        }

        /* Cards Layout */
        .pricing-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 30px;
            width: 100%;
        }

        .price-card {
            background-color: rgba(255, 255, 255, 0.01);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 40px 30px;
            text-align: left;
            position: relative;
            display: flex;
            flex-direction: column;
            transition: 0.3s;
        }

        .price-card:hover {
            border-color: #00e5ff;
            transform: translateY(-4px);
        }

        .badge-container {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 20px;
        }

        .credit-badge { color: #00e5ff; font-weight: 600; }
        .time-badge { color: #94a3b8; }

        .plan-name {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .plan-desc {
            font-size: 0.95rem;
            color: #94a3b8;
            margin-bottom: 25px;
        }

        .price {
            font-size: 2.8rem;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .price span {
            font-size: 0.9rem;
            color: #94a3b8;
            font-weight: 400;
        }

        .billing-info {
            font-size: 0.85rem;
            color: #64748b;
            margin-bottom: 30px;
        }

        .features-title {
            font-size: 0.9rem;
            color: #94a3b8;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .features {
            list-style: none;
            margin-bottom: 40px;
        }

        .features li {
            font-size: 0.95rem;
            color: #cbd5e1;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
        }

        .features li::before {
            content: "✓";
            color: #00e5ff;
            margin-right: 12px;
            font-weight: bold;
        }

        .card-btn {
            width: 100%;
            padding: 14px;
            border-radius: 25px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            border: none;
            margin-top: auto;
            text-align: center;
            transition: background 0.2s;
        }

        .btn-pro {
            background-color: #ffffff;
            color: #0b111e;
        }

        .btn-max {
            background-color: #00e5ff;
            color: #0b111e;
        }

        .card-btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <!-- Top Navigation Tabs -->
    <nav class="top-nav">
        <span class="nav-item">Free plan</span>
        <span class="nav-item upgrade-pro-link" id="upgradeProLink">Upgrade Pro</span>
    </nav>

    <!-- Hero Header -->
    <header class="hero-section">
        <h1 class="top-heading">Intelligent Insights.<br><span class="cyan-text">Smarter Decisions.</span></h1>
        
        <!-- 🆕 बटन वापस जोड़ दिया गया है -->
        <button class="primary-btn" id="downloadBtn">Download Free Tools ⚡</button>
    </header>

    <!-- AI Search Box -->
    <section class="search-section">
        <div class="search-container">
            <h3 class="search-box-title">What do you want to know?</h3>
            <input type="text" class="search-input" placeholder="Ask anything...">
            <div class="search-footer">
                <div class="search-options">
                    <span>🌐 Focus</span>
                    <span>📎 Attach</span>
                </div>
                <button class="submit-search-btn" style="background-color: #4cc9f0; color: #0b111e; border: none; padding: 8px 20px; border-radius: 20px; font-weight:600; cursor:pointer;">Search</button>
            </div>
        </div>
    </section>

    <!-- PRICING SECTION -->
    <section class="pricing-section" id="pricingSection">
        <h2>Select your plan</h2>
        <p>Upgrade for a broader search experience and premium AI models.</p>
        
        <div class="toggle-container">
            <button class="toggle-btn active" id="monthlyBtn">Monthly</button>
            <button class="toggle-btn" id="yearlyBtn">Yearly (Save 20% )</button>
        </div>

        <div class="pricing-container">
            
            <!-- Card 1: Perplexity Pro -->
            <div class="price-card">
                <div class="badge-container">
                    <span class="credit-badge">+$10 free Credits</span>
                    <span class="time-badge">⏱️ Limited Time</span>
                </div>
                <div class="plan-name">perplexity pro</div>
