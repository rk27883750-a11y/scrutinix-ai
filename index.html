<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scrutinix AI - Premium AI Assets & Code Marketplace</title>
    
    <!-- Lemon Squeezy Script for Overlay Checkout -->
    <script src="https://lemonsqueezy.com" defer></script>

    <!-- Google Schema Markup for Logo in Search -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Scrutinix AI",
      "url": "https://github.io",
      "logo": "https://github.ioassets/logo.png"
    }
    </script>

    <style>
        /* ==========================================
           1. RESET & VARIABLES (Dark Neon Theme)
           ========================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        :root {
            --bg-main: #0B0F19;       
            --bg-sidebar: #070A12;    
            --bg-card: #131A2A;       
            --accent-cyan: #00F2FE;   
            --accent-purple: #9b51e0; 
            --text-main: #F3F4F6;     
            --text-muted: #9CA3AF;    
            --border-color: #1E293B;  
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            overflow: hidden; 
            height: 100vh;
            width: 100vw;
        }

        /* ==========================================
           2. THREE-PANEL LAYOUT STRUCTURE
           ========================================== */
        .dashboard-container {
            display: flex;
            height: 100vh;
            width: 100vw;
        }

        /* --- PANEL 1: LEFT SIDEBAR --- */
        .sidebar {
            width: 280px;
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 24px;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .brand {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(45deg, var(--accent-cyan), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 30px;
            cursor: pointer;
        }

        .categories {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-grow: 1;
        }

        .cat-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 12px 16px;
            text-align: left;
            font-size: 14px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .cat-btn:hover, .cat-btn.active {
            background-color: rgba(0, 242, 254, 0.08);
            color: var(--accent-cyan);
        }

        .pricing-section {
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .pro-banner {
            background: linear-gradient(135deg, rgba(155, 81, 224, 0.15), rgba(0, 242, 254, 0.15));
            border: 1px solid var(--accent-purple);
            padding: 14px;
            border-radius: 12px;
            font-size: 13px;
            text-align: center;
            font-weight: 700;
            color: #FFF;
            text-decoration: none;
            box-shadow: 0 0 15px rgba(155, 81, 224, 0.15);
            transition: transform 0.2s;
        }

        .pro-banner:hover {
            transform: scale(1.02);
        }

        /* --- PANEL 2: CENTER IMAGE FEED --- */
        .main-feed {
            flex-grow: 1;
            padding: 30px;
            overflow-y: auto;
            background-color: var(--bg-main);
        }

        .feed-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 20px;
            color: #FFF;
        }

        .image-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        .image-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1), border-color 0.3s ease;
            aspect-ratio: 1 / 1;
        }

        .image-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-cyan);
            box-shadow: 0 8px 24px rgba(0, 242, 254, 0.15);
        }

        .image-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none; /* Block drag-and-drop */
            user-select: none;
        }

        .overlay-btn {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(7, 10, 18, 0.95));
            padding: 20px 15px 15px;
            color: #FFF;
            font-size: 13px;
            font-weight: 600;
            text-align: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .image-card:hover .overlay-btn {
            opacity: 1;
        }

        /* --- PANEL 3: RIGHT DETAILS PANEL --- */
        .right-panel {
            width: 360px;
            background-color: var(--bg-sidebar);
            border-left: 1px solid var(--border-color);
            padding: 30px 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .placeholder-text {
            color: var(--text-muted);
            font-size: 14px;
            text-align: center;
            margin-auto: auto;
            line-height: 1.6;
        }

        /* ==========================================
           3. INTERACTION & UTILITY UI COMPONENTS
           ========================================== */
        .detail-box {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .detail-preview-wrapper {
            position: relative;
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .detail-preview {
            width: 100%;
            display: block;
            pointer-events: none;
        }

        .detail-box h3 {
            font-size: 20px;
            font-weight: 700;
        }

        .price-tag {
            font-size: 24px;
            font-weight: 800;
            color: var(--accent-cyan);
        }

        .prompt-section {
            background-color: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            padding: 16px;
            border-radius: 8px;
        }

        .prompt-section h5 {
            color: var(--text-muted);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .prompt-section code {
            font-family: 'Courier New', Courier, monospace;
            color: #FF79C6;
            font-size: 13px;
            word-break: break-all;
        }

        .features-list {
            list-style: none;
            font-size: 13px;
            color: var(--text-muted);
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .features-list li::before {
            content: "✓ ";
            color: var(--accent-cyan);
            font-weight: bold;
        }

        .buy-btn {
            background: linear-gradient(45deg, var(--accent-cyan), var(--accent-purple));
            color: #000;
            border: none;
            padding: 16px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            transition: opacity 0.2s, transform 0.1s;
        }

        .buy-btn:hover { opacity: 0.95; }
        .buy-btn:active { transform: scale(0.98); }
    </style>
</head>
