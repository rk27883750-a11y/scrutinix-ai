<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scrutinix AI - Visual Research Studio</title>
  <style>
    :root {
      --bg-color: #0b1120;
      --card-bg: #1e293b;
      --accent-color: #38bdf8;
      --text-color: #f8fafc;
      --text-secondary: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-color); padding: 20px; min-height: 100vh; }

    header { text-align: center; margin-bottom: 25px; }
    header h1 { font-size: 2.2rem; color: var(--accent-color); }
    header p { color: var(--text-secondary); font-size: 0.95rem; margin-top: 5px; }

    .search-container { max-width: 800px; margin: 0 auto 25px auto; display: flex; gap: 10px; }
    .search-input { flex: 1; padding: 14px 18px; border-radius: 8px; border: 1px solid #334155; background: var(--card-bg); color: #fff; font-size: 1rem; outline: none; }
    .search-input:focus { border-color: var(--accent-color); }
    .btn-search { padding: 14px 28px; background: var(--accent-color); border: none; border-radius: 8px; color: #0f172a; font-weight: bold; cursor: pointer; }

    .main-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; max-width: 1200px; margin: 0 auto; }
    @media (max-width: 850px) { .main-grid { grid-template-columns: 1fr; } }

    .panel { background: var(--card-bg); border-radius: 12px; border: 1px solid #334155; padding: 20px; display: flex; flex-direction: column; }
    .panel-title { font-size: 1.1rem; color: var(--accent-color); margin-bottom: 15px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }

    .btn-export { background: #334155; color: #38bdf8; border: 1px solid #38bdf8; padding: 4px 10px; font-size: 0.75rem; border-radius: 4px; cursor: pointer; }
    
    #canvas-box { width: 100%; height: 320px; background-color: #070a13; border-radius: 8px; border: 1px solid #334155; }
    canvas { width: 100%; height: 100%; border-radius: 8px; }

    .slider-box { margin-top: 15px; background: #0f172a; padding: 12px; border-radius: 8px; border: 1px solid #334155; }
    .slider-box label { font-size: 0.85rem; color: var(--text-secondary); display: block; margin-bottom: 8px; }
    .timeline-slider { width: 100%; accent-color: var(--accent-color); cursor: pointer; }
    .year-display { text-align: center; font-weight: bold; color: var(--accent-color); margin-top: 5px; }

    .flashcards-container { display: flex; flex-direction: column; gap: 15px; height: 390px; overflow-y: auto; }
    .flashcard { background-color: #0f172a; border: 1px solid #38bdf8; border-radius: 8px; padding: 15px; text-align: center; color: var(--accent-color); font-weight: bold; }
    .flashcard p { color: #fff; font-weight: normal; margin-top: 5px; font-size: 0.9rem; }
  </style>
</head>
<body>

  <header>
    <h1>Scrutinix AI</h1>
    <p>3D Brain Graph • Time Slider • Study Flashcards</p>
  </header>

  <div class="search-container">
    <input type="text" id="searchInput" class="search-input" placeholder="Topic type karein (Jaise: HTML, Python, AI)...">
    <button onclick="runScrutinix()" class="btn-search">Scrutinize</button>
  </div>

  <div class="main-grid">
    <div class="panel">
      <div class="panel-title">
        <span>Interactive Brain-Graph</span>
        <button class="btn-export" onclick="exportGraph()">Download PNG</button>
      </div>
      <div id="canvas-box">
        <canvas id="graphCanvas"></canvas>
      </div>

      <div class="slider-box">
        <label for="timeline">Time-Travel Slider (Timeline Explorer):</label>
        <input type="range" id="timeline" class="timeline-slider" min="2000" max="2026" value="2026" oninput="updateTimeline(this.value)">
        <div class="year-display">Selected Era: <span id="yearVal">2026</span></div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-title"><span>Study Flashcards</span></div>
      <div id="flashcardsBox" class="flashcards-container"></div>
    </div>
  </div>

  <script>
    function drawGraph(topic) {
      const canvas = document.getElementById('graphCanvas');
      const ctx = canvas.getContext('2d');
      
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;

      const width = canvas.width;
      const height = canvas.height;
      const centerX = width / 2;
      const centerY = height / 2;

      ctx.clearRect(0, 0, width, height);

      const subNodes = ['Concepts', 'Architecture', 'Practices', 'APIs', 'Ecosystem'];
      const numNodes = subNodes.length;
      const radius = Math.min(width, height) / 3.2;

      subNodes.forEach((_, i) => {
        const angle = (i * 2 * Math.PI) / numNodes;
        const x = centerX + radius * Math.cos(angle);
        const y = centerY + radius * Math.sin(angle);

        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.lineTo(x, y);
        ctx.strokeStyle = '#334155';
        ctx.lineWidth = 2;
        ctx.stroke();
      });

      subNodes.forEach((name, i) => {
        const angle = (i * 2 * Math.PI) / numNodes;
        const x = centerX + radius * Math.cos(angle);
        const y = centerY + radius * Math.sin(angle);

        ctx.beginPath();
        ctx.arc(x, y, 22, 0, 2 * Math.PI);
        ctx.fillStyle = '#34d399';
        ctx.fill();

        ctx.fillStyle = '#0f172a';
        ctx.font = 'bold 10px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(name, x, y);
      });

      ctx.beginPath();
      ctx.arc(centerX, centerY, 35, 0, 2 * Math.PI);
      ctx.fillStyle = '#38bdf8';
      ctx.fill();

      ctx.fillStyle = '#0f172a';
      ctx.font = 'bold 12px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(topic.toUpperCase(), centerX, centerY);
    }

    function runScrutinix() {
      const input = document.getElementById('searchInput').value.trim();
      const currentTopic = input || "HTML";

      drawGraph(currentTopic);

      const flashcardsBox = document.getElementById('flashcardsBox');
      flashcardsBox.innerHTML = `
        <div class="flashcard">
          Q: ${currentTopic} ka Main Concept?
          <p>A: Structure aur core functionalities ko efficient banana.</p>
        </div>
        <div class="flashcard">
          Q: Real-World Usage?
          <p>A: Modern web applications aur tools design karne me.</p>
        </div>
        <div class="flashcard">
          Q: Best Practice?
          <p>A: Clean structure aur optimized components use karein.</p>
        </div>
      `;
    }

    function exportGraph() {
      const canvas = document.getElementById('graphCanvas');
      const image = canvas.toDataURL("image/png");
      const a = document.createElement("a");
      a.href = image;
      a.download = scrutinix-mindmap.png;
      a.click();
    }

    function updateTimeline(year) {
      document.getElementById('yearVal').innerText = year;
    }

    window.addEventListener('load', runScrutinix);
    window.addEventListener('resize', runScrutinix);
  </script>
</body>
</html>
