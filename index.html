<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scrutinix AI // System Generator</title>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- html2pdf Library for PDF Generation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    :root {
      --bg-color: #0b0f17;
      --card-bg: #111827;
      --input-bg: #1f2937;
      --border-color: #374151;
      --accent-color: #00f2fe;
      --accent-hover: #00c6ff;
      --text-main: #f9fafb;
      --text-muted: #9ca3af;
      --code-bg: #030712;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 28px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }

    .title {
      color: var(--accent-color);
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .description {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-row {
      display: flex;
      gap: 16px;
    }

    .form-row .form-group {
      flex: 1;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text-main);
    }

    input[type="text"], textarea, select {
      width: 100%;
      padding: 12px 14px;
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-main);
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus, textarea:focus, select:focus {
      border-color: var(--accent-color);
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background: linear-gradient(90deg, #00f2fe 0%, #4facfe 100%);
      border: none;
      border-radius: 8px;
      color: #000;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      transition: opacity 0.2s;
      margin-top: 10px;
    }

    .btn-submit:hover {
      opacity: 0.9;
    }

    .disclaimer {
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 12px;
    }

    /* Output Section */
    .output-section {
      display: none;
    }

    .output-header {
      color: var(--accent-color);
      font-weight: 600;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }

    .tab-btn {
      padding: 8px 16px;
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
    }

    .tab-btn.active {
      background-color: var(--accent-color);
      color: #000;
      border-color: var(--accent-color);
      font-weight: 600;
    }

    .code-container {
      background-color: var(--code-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 16px;
      overflow-x: auto;
      margin-bottom: 16px;
    }

    pre {
      font-family: 'Fira Code', monospace;
      font-size: 0.85rem;
      color: #38bdf8;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn-secondary {
      padding: 10px 16px;
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-secondary:hover {
      border-color: var(--accent-color);
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- Top Section: Form -->
    <div class="card">
      <h1 class="title">Scrutinix AI // System_Generator</h1>
      <p class="description">
        Skip manual Figma asset hunting. Enter core parameters to generate production-ready CSS Tokens and Tailwind Config structure instantly.
      </p>

      <form id="generatorForm">
        <div class="form-group">
          <label for="projectName">Project Name:</label>
          <input type="text" id="projectName" placeholder="e.g., grocery app" value="grocery app" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="brandColor">Brand Primary Color (HEX):</label>
            <input type="text" id="brandColor" placeholder="e.g., #351156" value="#351156" required>
          </div>
          <div class="form-group">
            <label for="fontSelect">Select Typography Font:</label>
            <select id="fontSelect">
              <option value="Roboto" selected>Roboto</option>
              <option value="Inter">Inter</option>
              <option value="Poppins">Poppins</option>
              <option value="Open Sans">Open Sans</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="customRules">Additional Layout / Component Rules:</label>
          <textarea id="customRules" placeholder="e.g., Custom configuration constraints, base-padding: 16px...">base-padding: 16px, border-radius-md: 8px</textarea>
        </div>

        <button type="submit" class="btn-submit">
          ⚡ GENERATE TOKENS & ARCHITECTURE
        </button>
      </form>

      <div class="disclaimer">
        Disclaimer: Scrutinix AI provides automation utilities for developers
      </div>
    </div>

    <!-- Bottom Section: Generated Output -->
    <div class="card output-section" id="outputSection">
      <div class="output-header">
        ⚡ Generated Production-Ready Output
      </div>

      <div class="tabs">
        <button class="tab-btn active" id="tabCss" onclick="switchTab('css')">CSS Variables (:root)</button>
        <button class="tab-btn" id="tabTailwind" onclick="switchTab('tailwind')">Tailwind Config Extend</button>
      </div>

      <div class="code-container" id="pdfPrintArea">
        <pre><code id="codeOutput"></code></pre>
      </div>

      <div class="actions">
        <button class="btn-secondary" onclick="downloadFile('css')">📥 Export variables.css</button>
        <button class="btn-secondary" onclick="downloadFile('tailwind')">📥 Export tailwind.config.js</button>
        <button class="btn-secondary" onclick="downloadPdf()">📄 Export Spec PDF</button>
      </div>
    </div>

  </div>

  <script>
    let generatedCssCode = '';
    let generatedTailwindCode = '';
    let currentTab = 'css';

    function hexToRgb(hex) {
      hex = hex.replace('#', '');
      if (hex.length === 3) {
        hex = hex.split('').map(char => char + char).join('');
      }
      const num = parseInt(hex, 16);
      if (isNaN(num)) return '53, 17, 86';
      return `${(num >> 16) & 255}, ${(num >> 8) & 255}, ${num & 255}`;
    }

    document.getElementById('generatorForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const name = document.getElementById('projectName').value.trim() || 'app';
      const color = document.getElementById('brandColor').value.trim() || '#351156';
      const font = document.getElementById('fontSelect').value;
      const rules = document.getElementById('customRules').value.trim();

      const rgbColor = hexToRgb(color);

      let customCssRules = '';
      let customTailwindRules = '';

      if (rules) {
        const parts = rules.split(',');
        parts.forEach(part => {
          const [key, val] = part.split(':').map(s => s.trim());
          if (key && val) {
            const cleanKey = key.replace(/\s+/g, '-').toLowerCase();
            customCssRules += `  --${cleanKey}: ${val};\n`;
            customTailwindRules += `        '${cleanKey}': '${val}',\n`;
          }
        });
      }

      if (!customCssRules) {
        customCssRules = '  --base-padding: 16px;\n  --border-radius-md: 8px;\n';
        customTailwindRules = "        'base-padding': '16px',\n        'border-radius-md': '8px',\n";
      }

      generatedCssCode = `:root {\n  /* Project Identity: ${name} */\n  --primary-brand: ${color};\n  --primary-brand-rgb: ${rgbColor};\n  --main-font-stack: '${font}', sans-serif;\n  --heading-font-stack: '${font}', sans-serif;\n\n  /* Custom Configuration Constraints */\n${customCssRules}}`;

      generatedTailwindCode = `// tailwind.config.js - Project: ${name}\nmodule.exports = {\n  theme: {\n    extend: {\n      colors: {\n        'primary-brand': '${color}',\n      },\n      fontFamily: {\n        sans: ['${font}', 'sans-serif'],\n      },\n      spacing: {\n${customTailwindRules}      }\n    },\n  },\n};`;

      document.getElementById('outputSection').style.display = 'block';
      updateCodeDisplay();
      
      document.getElementById('outputSection').scrollIntoView({ behavior: 'smooth' });
    });

    function switchTab(tab) {
      currentTab = tab;
      document.getElementById('tabCss').classList.toggle('active', tab === 'css');
      document.getElementById('tabTailwind').classList.toggle('active', tab === 'tailwind');
      updateCodeDisplay();
    }

    function updateCodeDisplay() {
      const codeElement = document.getElementById('codeOutput');
      codeElement.textContent = currentTab === 'css' ? generatedCssCode : generatedTailwindCode;
    }

    function downloadFile(type) {
      let content = type === 'css' ? generatedCssCode : generatedTailwindCode;
      let filename = type === 'css' ? 'variables.css' : 'tailwind.config.js';
      let mimeType = type === 'css' ? 'text/css' : 'text/javascript';

      if (!content) {
        alert('Pehle tokens generate kijiye!');
        return;
      }

      const blob = new Blob([content], { type: mimeType });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    // Working PDF Download Function
    function downloadPdf() {
      const element = document.getElementById('pdfPrintArea');
      const projectName = document.getElementById('projectName').value.trim() || 'Design_System';

      if (!generatedCssCode) {
        alert('Pehle tokens generate kijiye!');
        return;
      }

      const opt = {
        margin:       10,
        filename:     `${projectName}_Spec.pdf`,
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2 },
        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
      };

      html2pdf().set(opt).from(element).save();
    }
  </script>
</body>
</html>
