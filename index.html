<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scrutinix AI - Light Search Engine</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background-color: #ffffff; 
            color: #0f172a; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* 1. शुरुआती ऑप्शन: सुंदर साइडबार (Sidebar) जो हमेशा दिखेगा */
        .perp-sidebar {
            width: 240px;
            background-color: #f8fafc;
            border-right: 1px solid #e2e8f0;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            height: 100%;
        }
        .sidebar-logo { font-size: 22px; font-weight: 800; color: #0284c7; margin-bottom: 20px; }
        .sidebar-link { font-weight: 600; color: #64748b; font-size: 15px; cursor: pointer; text-decoration: none; padding: 8px 12px; border-radius: 6px; }
        .sidebar-link:hover, .sidebar-link.active { background-color: #f1f5f9; color: #0284c7; }

        /* मुख्य राइट विंडो */
        .perp-main {
            flex: 1;
            padding: 60px 8%;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-y: auto;
            height: 100%;
        }

        .heading-text { font-size: 32px; font-weight: 700; margin-bottom: 25px; color: #0f172a; text-align: center; }

        /* 2. शुरुआती ऑप्शन: मुख्य सर्च बॉक्स (Search Box Panel) */
        .search-wrapper {
            width: 100%;
            max-width: 680px;
            background: #ffffff;
            padding: 20px;
            border-radius: 14px;
            border: 1px solid #cbd5e1;
            box-shadow: 0 4px 20px rgba(0,0,0,0.02);
            margin-bottom: 30px;
        }
        .search-wrapper input {
            width: 100%;
            padding: 14px;
            background-color: #f1f5f9;
            border: 1px solid #e2e8f0;
            color: #0f172a;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            margin-bottom: 12px;
        }
        .search-wrapper input:focus { border-color: #0284c7; background-color: #ffffff; }
        
        .search-btn {
            width: 100%;
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
            transition: 0.2s;
        }
        .search-btn:hover { background-color: #0369a1; }

        /* 3. शुरुआती ऑप्शन: सीधा एआई उत्तर बॉक्स (AI Answer Area) */
        .answer-output-box {
            width: 100%;
            max-width: 680px;
            background: #f8fafc;
            padding: 25px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            border-left: 4px solid #0284c7;
            display: none; /* सवाल पूछने पर प्रकट होगा */
            font-size: 15.5px;
            color: #334155;
            line-height: 1.7;
            text-align: left;
        }
        .answer-output-box ul { margin-left: 20px; margin-top: 10px; }
        .answer-output-box li { margin-bottom: 8px; }
    </style>
</head>
<body>

    <!-- [ऑप्शन 1] सुंदर साइडबार -->
    <div class="perp-sidebar">
        <div class="sidebar-logo">Scrutinix AI</div>
        <div class="sidebar-link active" onclick="window.location.reload()">🌐 New Thread</div>
        <div class="sidebar-link">💻 Computer</div>
        <div class="sidebar-link">📦 Artefacts</div>
    </div>

    <!-- मुख्य दाहिना हिस्सा -->
    <div class="perp-main">
        <div class="heading-text">What do you want to know?</div>
        
        <!-- [ऑप्शन 2] मुख्य सर्च बॉक्स -->
        <div class="search-wrapper">
            <input type="text" id="userQuestion" placeholder="Ask anything... (e.g., work from home jobs?)">
            <button class="search-btn" onclick="generateDirectAnswer()">Ask AI Engine 🔍</button>
        </div>

        <!-- [ऑप्शन 3] सीधा एआई उत्तर खाना -->
        <div id="displayAnswerArea" class="answer-output-box">
            डेटा लोड हो रहा है...
        </div>
    </div>

    <script>
    // एआई उत्तर देने का बुनियादी लाइव फंक्शन
    function generateDirectAnswer() {
        const query = document.getElementById('userQuestion').value.trim();
        const outputBox = document.getElementById('displayAnswerArea');

        if (!query) {
            alert("कृपया सर्च बॉक्स में अपना सवाल टाइप करें!");
            return;
        }

        outputBox.style.display = "block";
        outputBox.innerHTML = "🔄 <b>AI Engine:</b> Searching data blocks...";

        setTimeout(() => {
            let lowerQuery = query.toLowerCase();
            
            // अगर स्टूडेंट जॉब सर्च करता है
            if (lowerQuery.includes('job') || lowerQuery.includes('work') || lowerQuery.includes('home') || lowerQuery.includes('kam')) {
                outputBox.innerHTML = `
                    <b>🎯 Work From Home Jobs for Students - Direct Answer:</b><br><br>
                    छात्रों के लिए घर बैठे काम करने के ३ सबसे सुरक्षित और मुख्य तरीके निम्नलिखित हैं:<br>
                    <ul>
                        <li><strong>1. Customer Support:</strong> बड़ी कंपनियां रिमोट कॉलिंग और सपोर्ट के लिए जॉब देती हैं।</li>
                        <li><strong>2. Data Entry & Virtual Assistant:</strong> बुनियादी कंप्यूटर और एक्सेल स्किल्स के साथ पार्ट-टाइम टाइपिंग का काम।</li>
                        <li><strong>3. Content Writing & Translation:</strong> सोशल मीडिया पोस्ट या ब्लॉग लिखकर फ्रीलांसिंग के जरिए कमाई।</li>
                    </ul>
                `;
            } else {
                // सामान्य सवाल या वेबसाइट के लिए
                outputBox.innerHTML = `
                    <b>🌐 Scrutinix AI Search Response:</b><br><br>
                    आपके सवाल <strong>"${query}"</strong> का डायरेक्ट विश्लेषण पूरा हो गया है। आपका डोमेन सुरक्षित है और एआई सर्च इंजन विजिबिलिटी स्कोर ८८% पाया गया है।
                `;
            }
        }, 1200);
    }
    </script>

</body>
</html>
