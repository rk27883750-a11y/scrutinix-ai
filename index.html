<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scrutinix AI - Smart Automation for Smarter Business</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #040814;
            color: #ffffff;
            padding: 20px;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(0, 162, 255, 0.22) 0%, transparent 45%),
                radial-gradient(circle at 85% 85%, rgba(168, 85, 247, 0.22) 0%, transparent 45%);
            background-attachment: fixed;
        }

        .container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 45px 35px;
            background: linear-gradient(135deg, #0a1128 0%, #060a17 100%);
            border-radius: 28px;
            border: 1px solid rgba(0, 162, 255, 0.25);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.7), 0 0 40px rgba(0, 162, 255, 0.12);
        }

        /* Header / Brand */
        .brand-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 45px;
            flex-wrap: wrap;
            gap: 20px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .logo-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #00b4d8, #7928ca);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            font-weight: 900;
            color: white;
            box-shadow: 0 0 20px rgba(0, 180, 216, 0.6);
        }

        .logo-text h1 {
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 0.5px;
        }

        .logo-text p {
            font-size: 13px;
            color: #a0aec0;
            font-weight: 500;
        }

        .top-badges {
            display: flex;
            gap: 12px;
            background: rgba(255, 255, 255, 0.05);
            padding: 10px 20px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            font-size: 13px;
            color: #e2e8f0;
            align-items: center;
            font-weight: 600;
        }

        .top-badges i {
            color: #00f2fe;
        }

        /* Main Heading */
        .main-title-section {
            margin-bottom: 40px;
        }

        .main-title-section h2 {
            font-size: 42px;
            font-weight: 900;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        .main-title-section h2 span {
            background: linear-gradient(90deg, #00f2fe, #d946ef);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .main-title-section h3 {
            font-size: 26px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 10px;
        }

        .main-title-section p {
            color: #a0aec0;
            font-size: 16px;
            font-weight: 400;
        }

        /* 5 Amazing Features Grid */
        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 18px;
            margin-bottom: 50px;
        }

        .feature-card {
            background: linear-gradient(180deg, rgba(13, 22, 43, 0.95) 0%, rgba(7, 12, 24, 0.95) 100%);
            border-radius: 20px;
            padding: 22px;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.4);
            transition: transform 0.3s ease;
        }

        .feature-card:hover {
            transform: translateY(-6px);
        }

        .feature-card:nth-child(1) { border: 1.5px solid #10b981; box-shadow: 0 0 20px rgba(16, 185, 129, 0.15); }
        .feature-card:nth-child(2) { border: 1.5px solid #00b4d8; box-shadow: 0 0 20px rgba(0, 180, 216, 0.15); }
        .feature-card:nth-child(3) { border: 1.5px solid #7c3aed; box-shadow: 0 0 20px rgba(124, 58, 237, 0.15); }
        .feature-card:nth-child(4) { border: 1.5px solid #06b6d4; box-shadow: 0 0 20px rgba(6, 182, 212, 0.15); }
        .feature-card:nth-child(5) { border: 1.5px solid #d946ef; box-shadow: 0 0 20px rgba(217, 70, 239, 0.15); }

        .f-num-icon {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .f-num {
            width: 28px;
            height: 28px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 800;
        }

        .f-icon {
            font-size: 24px;
        }

        .feature-card:nth-child(1) .f-icon { color: #10b981; }
        .feature-card:nth-child(2) .f-icon { color: #00b4d8; }
        .feature-card:nth-child(3) .f-icon { color: #7c3aed; }
        .feature-card:nth-child(4) .f-icon { color: #06b6d4; }
        .feature-card:nth-child(5) .f-icon { color: #d946ef; }

        .feature-card h4 {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 8px;
            line-height: 1.4;
        }

        .feature-card p {
            font-size: 12px;
            color: #a0aec0;
            line-height: 1.5;
            margin-bottom: 15px;
        }

        .mini-ui {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 10px;
            padding: 10px;
            font-size: 11px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        /* Testing Console / Form Section */
        .testing-section {
            background: rgba(13, 22, 43, 0.8);
            border: 1px solid rgba(0, 242, 254, 0.3);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
        }

        .testing-section h3 {
            font-size: 20px;
            margin-bottom: 15px;
            color: #00f2fe;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 13px;
            color: #cbd5e1;
            font-weight: 600;
        }

        .form-group input {
            background: rgba(5, 10, 20, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 12px;
            border-radius: 10px;
            color: white;
            font-size: 14px;
        }

        .form-group input:focus {
            outline: none;
            border-color: #00f2fe;
        }

        /* Bottom Workflow Steps Section */
        .bottom-workflow-section {
            background: rgba(13, 22, 43, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 25px;
            margin-top: 30px;
        }

        .bottom-workflow-title {
            font-size: 18px;
            font-weight: 800;
            margin-bottom: 20px;
        }

        .workflow-steps-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            align-items: center;
        }

        .step-box {
            background: rgba(5, 10, 20, 0.8);
            border: 1px solid rgba(0, 180, 216, 0.3);
            border-radius: 14px;
            padding: 16px;
            text-align: center;
        }

        .step-box i {
            font-size: 26px;
            color: #00f2fe;
            margin-bottom: 8px;
        }

        .step-box h5 {
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .step-box p {
            font-size: 11px;
            color: #a0aec0;
        }

        /* Footer Details & CTA */
        .footer-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            flex-wrap: wrap;
            gap: 20px;
        }

        .footer-points {
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 13px;
            color: #cbd5e1;
        }

        .footer-points span {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .footer-points i {
            color: #10b981;
        }

        .cta-btn {
            background: linear-gradient(135deg, #00f2fe, #7928ca);
            color: white;
            padding: 14px 28px;
            border-radius: 14px;
            font-weight: 800;
            font-size: 15px;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 10px 25px rgba(0, 242, 254, 0.4);
            text-decoration: none;
            transition: opacity 0.2s;
        }
