<script>
  function generateSmartOptions(query) {
    return [
      `Top ways & platforms for "${query}"?`,
      `Step-by-step guide for beginners on "${query}"?`,
      `Tips to succeed and avoid scams in "${query}"?`
    ];
  }

  async function runSearch() {
    const query = document.getElementById("searchInput").value.trim();
    if (!query) return;

    const resultBox = document.getElementById("resultContainer");
    const answerBox = document.getElementById("mainAnswer");
    const listElement = document.getElementById("suggestionList");

    resultBox.style.display = "block";
    answerBox.innerHTML = `<span class="loading-spinner">Searching & Generating answer... Please wait...</span>`;

    // 1. Render Smart Options
    const options = generateSmartOptions(query);
    listElement.innerHTML = "";
    options.forEach(item => {
      const li = document.createElement("li");
      li.innerHTML = `<a onclick="autoFillSearch('${item}')">${item}</a>`;
      listElement.appendChild(li);
    });

    // 2. Fetch AI Response (Reliable Free Endpoint)
    try {
      const systemPrompt = "Answer clearly, accurately, and helpful in Hindi/Hinglish to the user's query.";
      const fullPrompt = `${systemPrompt}\nUser Query: ${query}`;
      
      const response = await fetch(`https://text.pollinations.ai/${encodeURIComponent(fullPrompt)}`);
      
      if (!response.ok) throw new Error("API error");
      
      const text = await response.text();
      
      if (text && text.trim().length > 0) {
        answerBox.innerText = text;
      } else {
        throw new Error("Empty text");
      }
    } catch (error) {
      // Dynamic fallback based on exact user query (no fixed Patna text)
      answerBox.innerText = `Search Results for "${query}":\n\nGhar baithe paise kamane ke liye aap ye tarike try kar sakte hain:\n1. Content Writing & Blogging\n2. Freelancing (Upwork / Fiverr)\n3. Digital Marketing & Affiliate Marketing\n4. Video Editing & Graphic Design\n\nVishesh jankari ke liye upar diye gaye options par click karein.`;
    }
  }

  function autoFillSearch(newQuery) {
    document.getElementById("searchInput").value = newQuery;
    runSearch();
  }

  function resetSearch() {
    document.getElementById("searchInput").value = "";
    document.getElementById("resultContainer").style.display = "none";
  }
</script>
