<script>
  let network = null;

  function runScrutinix() {
    const input = document.getElementById('searchInput').value.trim();
    const currentTopic = input || "HTML";
    const key = currentTopic.toLowerCase();

    // Check if Vis.js library is loaded safely
    if (typeof vis === 'undefined') {
      alert("Vis.js library load nahi hui hai. Kripya internet check karke page reload karein!");
      return;
    }

    const subNodes = ['Tags & Elements', 'Attributes', 'DOM Structure', 'CSS Integration', 'HTML5 APIs'];

    // Build Graph Nodes
    const nodesArr = [{ id: 1, label: currentTopic.toUpperCase(), shape: 'dot', size: 28, color: '#38bdf8', font: { color: '#fff', size: 16 } }];
    const edgesArr = [];

    subNodes.forEach((name, index) => {
      const id = index + 2;
      nodesArr.push({ id: id, label: name, shape: 'dot', size: 16, color: '#34d399', font: { color: '#f8fafc' } });
      edgesArr.push({ from: 1, to: id, color: { color: '#334155' } });
    });

    const container = document.getElementById('network-graph');
    const data = { nodes: new vis.DataSet(nodesArr), edges: new vis.DataSet(edgesArr) };
    const options = { nodes: { borderWidth: 2 }, physics: { stabilization: false, barnesHut: { springLength: 100 } } };

    network = new vis.Network(container, data, options);

    // Render Flashcards
    const flashcardsBox = document.getElementById('flashcardsBox');
    flashcardsBox.innerHTML = `
      <div class="flashcard" onclick="this.classList.toggle('flipped')">
        <div class="flashcard-inner"><div class="card-front">Q: ${currentTopic} ka Mukhya Concept?</div><div class="card-back">A: Web structure aur basic layout तैयार करना।</div></div>
      </div>
      <div class="flashcard" onclick="this.classList.toggle('flipped')">
        <div class="flashcard-inner"><div class="card-front">Q: Real-world Use?</div><div class="card-back">A: Sabhi modern websites aur web apps ka base hai.</div></div>
      </div>
      <div class="flashcard" onclick="this.classList.toggle('flipped')">
        <div class="flashcard-inner"><div class="card-front">Q: Best Practices?</div><div class="card-back">A: Semantic tags aur clean code nesting use karein.</div></div>
      </div>
    `;
  }

  function exportGraph() {
    if (!network) return;
    const canvas = document.querySelectorAll('#network-graph canvas')[0];
    if (canvas) {
      const image = canvas.toDataURL("image/png");
      const a = document.createElement("a");
      a.href = image;
      a.download = scrutinix-mindmap.png;
      a.click();
    }
  }

  function updateTimeline(year) {
    document.getElementById('yearVal').innerText = year;
  }

  // Page Load hone ke baad run hoga
  window.addEventListener('DOMContentLoaded', () => {
    setTimeout(runScrutinix, 500);
  });
</script>
