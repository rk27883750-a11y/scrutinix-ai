<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scrutinix DocBot 🤖</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 90%; max-width: 600px; }
        input { width: 100%; padding: 14px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #ced4da; box-sizing: border-box; }
        button { width: 100%; padding: 14px; background-color: #28a745; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        button:disabled { background-color: #6c757d; }
        #result { margin-top: 25px; padding: 20px; background: #1e1e1e; color: #39ff14; border-radius: 8px; white-space: pre-wrap; word-break: break-word; font-family: monospace; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>Scrutinix DocBot 🤖</h2>
    <p style="color: #666;">अपना GitHub लिंक डालें और ऑटोमैटिक गाइड (README) पाएँ।</p>
    <input type="text" id="githubUrl" placeholder="https://github.com/username/repository">
    <button id="btn" onclick="generateDocs()">Generate Documentation</button>
    <div id="result"></div>
</div>

<script>
async function generateDocs() {
    const urlInput = document.getElementById('githubUrl').value;
    const resultDiv = document.getElementById('result');
    const btn = document.getElementById('btn');

    if (!urlInput || !urlInput.includes('github.com/')) {
        alert('कृपया एक सही GitHub Repository URL डालें!');
        return;
    }

    resultDiv.style.display = 'block';
    resultDiv.innerText = 'AI आपकी रिपॉजिटरी का विश्लेषण कर रहा है, कृपया प्रतीक्षा करें...';
    btn.disabled = true;

    try {
        const response = await fetch('/api/generate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ repoUrl: urlInput })
        });

        const data = await response.json();
        
        if (data.error) {
            resultDiv.innerText = 'त्रुटि: ' + data.error;
        } else {
            resultDiv.innerText = data.choices[0].message.content;
        }
    } catch (err) {
        resultDiv.innerText = 'सर्वर से कनेक्ट करने में समस्या आई। कृपया चेक करें।';
    } finally {
        btn.disabled = false;
    }
}
</script>

</body>
</html>
