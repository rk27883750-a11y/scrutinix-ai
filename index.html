<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scrutinix AI - 100% Free AI Search & SEO Platform</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body { 
            background: radial-gradient(circle at top, #1e293b 0%, #0b0f19 100%); 
            color: #fff; 
            min-height: 100vh;
            padding-bottom: 60px;
        }

        /* 1. सबसे ऊपर की चमकदार पट्टी (Announcement Bar) */
        .top-red-bar {
            background: linear-gradient(90deg, #ef4444, #f97316);
            color: white;
            text-align: center;
            padding: 10px;
            font-weight: bold;
            font-size: 14px;
            letter-spacing: 1px;
        }

        /* 2. नया ड्रॉपडाउन नेविगेशन बार */
        .navbar {
            background-color: #131926;
            border-bottom: 2px solid #1e293b;
            padding: 15px 40px;
            display: flex;
            justify-content: center;
            gap: 30px;
        }

        .nav-item {
            color: #cbd5e1;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            padding: 8px 16px;
            border-radius: 6px;
            transition: 0.3s;
            position: relative;
        }

        .nav-item:hover { color: #38bdf8; background-color: #1e293b; }

        .dropdown-menu {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            background-color: #131926;
            border: 2px solid #1e293b;
            border-radius: 8px;
            width: 240px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            z-index: 100;
            margin-top: 5px;
            padding: 10px 0;
        }

        .dropdown-menu a {
            color: #cbd5e1;
            padding: 12px 20px;
            text-decoration: none;
            display: block;
            font-size: 14px;
            border-bottom: 1px solid #1e293b;
            transition: 0.2s;
        }

        .dropdown-menu a:hover { background-color: #1e293b; color: #38bdf8; padding-left: 25px; }
        .nav-item-dropdown:hover .dropdown-menu { display: block; }

        /* 3. बीच का मुख्य हीरो बैनर */
        .hero-banner {
            max-width: 1400px;
            margin: 30px auto;
            background: #131926;
            border: 2px solid #1e293b;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .hero-banner h1 { font-size: 46px; color: #38bdf8; margin-bottom: 10px; }
        .hero-banner h2 { font-size: 26px; color: #22c55e; margin-bottom: 25px; }

        .feature-highlights {
            font-size: 20px; color: #cbd5e1; line-height: 1.8; font-weight: 600;
            background: #0b0f19; padding: 15px 30px; border-radius: 8px;
            border-left: 5px solid #38bdf8; display: inline-block;
        }

        /* 4. एडवांस परप्लेक्सिटी स्टाइल सर्च बॉक्स (With Mike, Camera, Focus) */
        .ai-search-box {
            max-width: 800px;
            margin: 40px auto;
            padding: 15px;
            background: #131926;
            border-radius: 16px;
            border: 2px solid #1e293b;
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .search-upper {
            width: 100%;
        }

        .search-upper textarea {
            width: 100%;
            height: 60px;
            background: transparent;
            border: none;
            color: white;
            font-size: 16px;
            outline: none;
            resize: none;
            font-family: inherit;
        }

        /* नीचे की कंट्रोल्स पट्टी (बिल्कुल Perplexity जैसी) */
        .search-controls-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #1e293b;
            padding-top: 12px;
        }

        .left-controls {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        /* फोकस, अटैचमेंट और माइक बटन्स की स्टाइल */
        .control-btn {
            background: #1e293b;
            color: #94a3b8;
            border: 1px solid #334155;
            padding: 8px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: 0.2s;
        }

        .control-btn:hover {
            color: #38bdf8;
            border-color: #38bdf8;
            background: #131926;
        }

        .submit-search-btn {
            background: #22c55e;
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s;
        }

        .submit-search-btn:hover { background: #16a34a; transform: scale(1.02); }

        .ai-response-area {
            max-width: 800px; margin: 0 auto 40px auto; padding: 20px; background: #0b0f19; border-radius: 12px;
            text-align: left; min-height: 50px; line-height: 1.6; color: #cbd5e1; display: none;
            border: 1px solid #1e293b;
        }

        /* 5. कैटगरी फ़िल्टर बटन्स */
        .filter-container {
            max-width: 1400px; margin: 40px auto; text-align: center;
            display: flex; justify-content: center; gap: 15px; flex-wrap: wrap;
        }

        .filter-btn {
            background-color: #2563eb; color: white; border: none; padding: 10px 24px;
            font-size: 15px; font-weight: bold; border-radius: 20px; cursor: pointer; transition: 0.3s;
        }

        .filter-btn:hover, .filter-btn.active { background-color: #38bdf8; color: #0b0f19; transform: scale(1.05); }

        /* 6. फुल-स्क्रीन टूल्स ग्रिड */
        .section-title { max-width: 1400px; margin: 50px auto 20px auto; font-size: 28px; color: #f97316; border-bottom: 2px solid #1e293b; padding-bottom: 10px; }
        
        .tools-grid { 
            display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); 
            gap: 30px; max-width: 1400px; margin: 0 auto; padding: 0 10px;
        }

        .tool-card { 
            background: #131926; border: 2px solid #1e293b; border-radius: 12px; padding: 22px; 
            display: flex; flex-direction: column; transition: 0.3s;
        }
        
        .tool-card:hover { border-color: #38bdf8; transform: translateY(-3px); }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .code-btn { background: #1e293b; color: #38bdf8; border: 1px solid #334155; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: bold; }
        
        .live-area { background: #0b0f19; padding: 15px; border-radius: 8px; flex-grow: 1; display: flex; flex-direction: column; gap: 10px; }
        .live-area input[type="text"], .live-area textarea { width: 100%; padding: 12px; background: #1e293b; border: 1px solid #334155; color: #fff; border-radius: 6px; outline: none;}
        button.action-btn { width: 100%; padding: 12px; border: none; font-weight: bold; border-radius: 6px; cursor: pointer; }
        .result-box { margin-top: 10px; text-align: center; max-height: 150px; overflow-y: auto; }

        /* प्राइजिंग टेबल */
        .pricing-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; max-width: 1400px; margin: 40px auto; padding: 0 10px; }
        .price-card { background: #131926; border: 2px solid #1e293b; border-radius: 12px; padding: 30px; display: flex; flex-direction: column; justify-content: space-between; transition: 0.3s; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: #131926; padding: 30px; border-radius: 16px; border: 2px solid #38bdf8; max-width: 500px; width: 90%; text-align: center; position: relative; }
        .modal-content input { width: 100%; padding: 12px; background: #0b0f19; border: 1px solid #334155; color: #fff; border-radius: 6px; margin-top: 10px; }
    </style>
</head>
