<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scrutinix AI - Website Insights</title>
    <style>
        /* CSS Reset & Dark Cyberpunk Theme */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #05070B;
            color: #FFFFFF;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .main-container {
            width: 100%;
            max-width: 1200px;
        }

        /* 1. Header Styles */
        header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        .logo {
            font-size: 22px;
            font-weight: bold;
            color: #FFFFFF;
        }
        .logo span {
            color: #00FFCC;
        }
        .nav-links {
            display: flex;
            list-style: none;
            gap: 25px;
        }
        .nav-links a {
            color: #8A99AD;
            text-decoration: none;
            font-size: 15px;
        }
        .nav-links a:hover {
            color: #FFFFFF;
        }
        .btn-green-glow {
            background: linear-gradient(135deg, #00FFCC, #0099FF);
            color: #000000;
            padding: 10px 20px;
            border-radius: 50px;
            font-weight: 600;
            text-decoration: none;
            font-size: 14px;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.3);
        }

        /* 2. Hero Section Split */
        .hero-section {
            display: flex;
            gap: 40px;
            align-items: center;
            justify-content: space-between;
            margin: 60px 0;
        }
        .hero-content {
            flex: 1.2;
        }
        .hero-content h1 {
            font-size: 42px;
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 20px;
        }
        .hero-content h1 span {
            color: #00FFCC;
        }
        .hero-content p {
            color: #8A99AD;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .input-glow-box {
            width: 100%;
            max-width: 450px;
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid #00FFCC;
            border-radius: 10px;
            color: #FFFFFF;
            font-size: 15px;
            outline: none;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.2);
        }

        /* Dashboard Preview Panel */
        .hero-dashboard {
            flex: 0.9;
            background: #0D0F16;
            border: 2px solid rgba(0, 153, 255, 0.3);
            box-shadow: 0 0 25px rgba(0, 153, 255, 0.15);
            border-radius: 14px;
            padding: 25px;
        }
        .dash-user {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 12px;
            margin-bottom: 20px;
        }
        .dash-user h3 span {
            color: #00FFCC;
        }
        .dash-grid {
            display: flex;
            gap: 15px;
        }
        .dash-card {
            flex: 1;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 15px;
            border-radius: 8px;
        }
        .stat-blue {
            font-size: 22px;
            font-weight: 700;
            color: #0099FF;
            margin-top: 5px;
        }

        /* Brand Ribbon */
        .ribbon-brands {
            display: flex;
            justify-content: space-between;
            padding: 20px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            color: #4A5568;
            font-weight: 600;
            margin-bottom: 60px;
        }

        /* 3. Six Grid Features Section */
        .headline-center {
            text-align: center;
            margin-bottom: 40px;
        }
        .headline-center span {
            color: #00FFCC;
            font-size: 12px;
            letter-spacing: 2px;
            font-weight: 700;
        }
        .headline-center h2 {
            font-size: 32px;
            margin-top: 10px;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 60px;
        }
        .grid-box {
            background: #0D0F16;
            border: 1px solid rgba(0, 255, 204, 0.15);
            border-radius: 12px;
            padding: 25px;
            transition: all 0.3s ease;
        }
        .grid-box:hover {
            border-color: #00FFCC;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.2);
            transform: translateY(-2px);
        }
        .box-title {
            font-size: 18px;
            margin: 10px 0;
            color: #FFFFFF;
        }
        .box-desc {
            color: #8A99AD;
            font-size: 14px;
            line-height: 1.5;
        }

        /* 4. Pricing Table */
        .pricing-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 60px;
        }
        .price-box {
            background: #0D0F16;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
        }
        .premium-active {
            border-color: #00FFCC;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.1);
        }
        .plan-title {
            color: #8A99AD;
            font-size: 15px;
            margin-bottom: 5px;
        }
        .plan-cost {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .plan-cost span {
            font-size: 14px;
            color: #8A99AD;
        }
        .features-list {
            list-style: none;
            margin-bottom: 25px;
            flex-grow: 1;
        }
        .features-list li {
            font-size: 14px;
            color: #CBD5E1;
            margin-bottom: 8px;
        }
        .btn-plan {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.04);
            color: #FFFFFF;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            font-size: 14px;
        }
        .price-box:hover .btn-plan {
            background: #FFFFFF;
            color: #000000;
        }

        /* Ctrl + K Shortcut Command Bar Overlay */
        .bar-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(5, 7, 11, 0.9);
            z-index: 9999;
            display: flex;
            justify-content: center;
            padding-top: 15vh;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }
        .bar-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .bar-body {
            width: 90%;
            max-width: 500px;
            background: #121620;
            border: 1px solid #00FFCC;
            border-radius: 10px;
            padding: 20px;
            height: fit-content;
        }
        .bar-input {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            color: #FFFFFF;
            font-size: 15px;
            outline: none;
            margin-bottom: 10px;
        }
        .bar-row {
            padding: 10px;
            color: #8A99AD;
            cursor: pointer;
        }
        .bar-row:hover {
            color: #00FFCC;
            background: rgba(0,255,204,0.05);
        }

        /* Responsive Settings for Tablets & Mobile */
        @media (max-width: 900px) {
            .hero-section { flex-direction: column; text-align: center; }
            .grid-container { grid-template-columns: repeat(2, 1fr); }
            .pricing-container { grid-template-columns: 1fr; }
            .nav-links { display: none; }
        }
        @media (max-width: 600px) {
            .grid-container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- 1. Header Navigation -->
        <header>
            <div class="logo">⚡ Scrutinix <span>AI</span></div>
            <ul class="nav-links">
                <li><a href="#features">Features</a></li>
                <li><a href="#pricing">Pricing</a></li>
                <li><a href="#">Docs</a></li>
            </ul>
            <a href="#" class="btn-green-glow">Get Started</a>
        </header>

        <!-- 2. Hero Section Split Layout -->
        <section class="hero-section">
            <div class="hero-content">
                <span style="color: #00FFCC; font-size: 12px; font-weight: bold; letter-spacing: 1px;">✨ NEXT-GEN AUTOMATION</span>
                <h1 style="margin-top: 10px;">Ask anything about your <span>website & business</span>.</h1>
