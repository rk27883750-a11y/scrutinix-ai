<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scrutinix DocBot - MVP</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 600px;
        }
        h2 { color: #222; margin-bottom: 5px; font-size: 26px; }
        p { color: #666; margin-bottom: 25px; font-size: 14px; }
        input[type="text"] {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            border: 1px solid #ced4da;
            border-radius: 8px;
            box-sizing: border-box;
            margin-bottom: 15px;
            outline: none;
        }
        input[type="text"]:focus { border-color: #28a745; }
        button {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 14px 24px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }
        button:hover { background-color: #218838; }
        #result {
            margin-top: 25px;
            padding: 20px;
            background: #1e1e1e;
            color: #39ff14;
            border-radius: 8px;
            text-align: left;
            white-space: pre-wrap;
            max-height: 400px;
            overflow-y: auto;
            display: none;
            font-family: 'Courier New', Courier, monospace;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Scrutinix DocBot 🤖</h2>
    <p>अपने GitHub प्रोजेक्ट का लिंक डालें और ऑटोमैटिक प्रोफेशनल गाइड (README) पाएं।</p>
    <input type="text" id="githubUrlInput" placeholder="उदाहरण: https://github.com">
    <button onclick="generateDocs()">Generate Documentation</button>
    <div id="result"></div>
</div>

<script>
async function generateDocs() {
    const githubUrl = document.getElementById('githubUrlInput').value;
    const resultDiv = document.getElementById('result');
    
    if (!githubUrl) {
        alert('कृपया अपने GitHub प्रोजेक्ट का URL डालें!');
        return;
    }

    resultDiv.style.display = "block";
    resultDiv.innerText = "⏳ आपके गिटहब कोड को पढ़कर AI गाइड तैयार कर रहा है... कृपया रुकें...";

    try {
        const response = await fetch("/api/search", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ githubUrl: githubUrl })
        });

        const data = await response.json();
        
        if (data.readme) {
            resultDiv.innerText = data.readme;
        } else {
            resultDiv.innerText = "❌ गड़बड़ हुई: " + (data.error || JSON.stringify(data));
        }
    } catch (error) {
        console.error("Error:", error);
        resultDiv.innerText = "❌ कनेक्शन एरर: " + error.message;
    }
}
</script>

</body>
</html>
