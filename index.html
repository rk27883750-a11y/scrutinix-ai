<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scrutinix AI - Website Insights</title>
    <style>
        /* Base Styles & Cyberpunk Theme */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, sans-serif;
        }
        body {
            background-color: #05070B;
            color: #FFFFFF;
            overflow-x: hidden;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Neon Glow Utility */
        .neon-border {
            border: 1px solid rgba(0, 255, 204, 0.2);
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.1), inset 0 0 15px rgba(0, 255, 204, 0.05);
            border-radius: 16px;
            background: rgba(13, 15, 22, 0.6);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }
        .neon-border:hover {
            border-color: rgba(0, 255, 204, 0.6);
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.3);
        }

        /* 1. Header / Navigation */
        header {
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding: 20px 0;
            position: sticky;
            top: 0;
            background: rgba(5, 7, 11, 0.8);
            backdrop-filter: blur(12px);
            z-index: 100;
        }
        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 22px;
            font-weight: 700;
            color: #FFFFFF;
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }
        .logo span {
            color: #00FFCC;
        }
        nav ul {
            display: flex;
            list-style: none;
            gap: 30px;
        }
        nav ul li a {
            color: #8A99AD;
            text-decoration: none;
            font-size: 15px;
            transition: color 0.3s;
        }
        nav ul li a:hover {
            color: #FFFFFF;
        }
        .header-btns {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .btn-signin {
            color: #FFFFFF;
            text-decoration: none;
            font-size: 15px;
        }
        .btn-glow {
            background: linear-gradient(135deg, #00FFCC, #0099FF);
            color: #000;
            padding: 10px 22px;
            border-radius: 100px;
            font-weight: 600;
            text-decoration: none;
            font-size: 15px;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-glow:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.6);
        }

        /* 2. Hero Section */
        .hero {
            padding: 80px 0;
            display: flex;
            gap: 50px;
            align-items: center;
        }
        .hero-left {
            flex: 1;
        }
        .hero-right {
            flex: 1;
        }
        .hero-tag {
            color: #00FFCC;
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
            display: inline-block;
        }
        .hero h1 {
            font-size: 48px;
            line-height: 1.15;
            font-weight: 800;
            margin-bottom: 25px;
            background: linear-gradient(to right, #FFF, #8A99AD);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .hero h1 span {
            background: linear-gradient(to right, #00FFCC, #0099FF);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .hero p {
            color: #8A99AD;
            font-size: 17px;
            line-height: 1.6;
            margin-bottom: 35px;
        }

        /* Mock Search Box UI */
        .search-box-wrapper {
            position: relative;
            margin-bottom: 20px;
        }
        .search-box {
            width: 100%;
            padding: 18px 25px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #FFF;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }
        .search-box:focus {
            border-color: #00FFCC;
        }
        .search-hint {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.1);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 12px;
            color: #8A99AD;
            pointer-events: none;
        }

        /* Dashboard Preview Mockup */
        .dashboard-mock {
            padding: 30px;
            border: 1px solid rgba(0, 153, 255, 0.2);
            box-shadow: 0 0 30px rgba(0, 153, 255, 0.1);
        }
        .mock-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 15px;
        }
        .mock-user {
            font-size: 18px;
            font-weight: 600;
        }
        .mock-user span {
            color: #00FFCC;
        }
        .mock-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .stat-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 12px;
        }
        .stat-val {
            font-size: 24px;
            font-weight: 700;
            color: #0099FF;
            margin-top: 5px;
        }

        /* 3. Features Grid Section */
        .section-title {
            text-align: center;
            margin: 80px 0 40px;
        }
        .section-title h2 {
            font-size: 36px;
            font-weight: 800;
            margin-bottom: 15px;
        }
        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            margin-bottom: 80px;
        }
        .feature-card {
            padding: 35px;
        }
        .feature-icon {
            font-size: 32px;
            margin-bottom: 20px;
        }
        .feature-card h3 {
            font-size: 20px;
            margin-bottom: 12px;
            color: #FFF;
        }
        .feature-card p {
            color: #8A99AD;
            font-size: 15px;
            line-height: 1.6;
        }

        /* 4. Pricing Section */
        .pricing-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            margin-bottom: 100px;
            align-items: stretch;
        }
        .price-card {
            padding: 40px 30px;
            display: flex;
            flex-direction: column;
        }
        .price-name {
            font-size: 18px;
            color: #8A99AD;
            margin-bottom: 10px;
        }
        .price-amount {
            font-size: 42px;
            font-weight: 800;
            margin-bottom: 25px;
        }
        .price-amount span {
            font-size: 16px;
            font-weight: 400;
            color: #8A99AD;
        }
        .price-features {
            list-style: none;
            margin-bottom: 35px;
            flex-grow: 1;
        }
        .price-features li {
            margin-bottom: 12px;
            font-size: 15px;
            color: #E2E8F0;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .price-features li::before {
            content: "✓";
            color: #00FFCC;
            font-weight: bold;
        }
        .btn-price {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            color: #FFF;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            transition: all 0.3s;
        }
        .price-card:hover .btn-price {
            background: #FFFFFF;
            color: #000;
        }

        /* 5. Ctrl + K Command Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 7, 11, 0.8);
            backdrop-filter: blur(8px);
            z-index: 1000;
            display: flex;
            justify-content: center;
            padding-top: 15vh;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .command-box {
            width: 100%;
            max-width: 600px;
            background: #0D0F16;
            border: 1px solid rgba(0, 255, 204, 0.3);
            box-shadow: 0 0 40px rgba(0, 255, 204, 0.15);
            border-radius: 14px;
            padding: 20px;
            height: max-content;
            transform: translateY(-20px);
            transition: transform 0.3s ease;
        }
        .modal-overlay.active .command-box {
            transform: translateY(0);
        }
