<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scrutinix AI // System_Generator</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #0a0f1d;
      --card-bg: #111827;
      --input-bg: #1f2937;
      --border-color: #374151;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --accent-blue: #38bdf8;
      --accent-teal: #10b981;
      --font-inter: 'Inter', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-inter);
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .wrapper {
      width: 100%;
      max-width: 700px;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 32px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    .header-title {
      color: var(--accent-blue);
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .header-subtitle {
      color: var(--text-muted);
      font-size: 0.85rem;
      line-height: 1.4;
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-row {
      display: flex;
      gap: 16px;
      margin-bottom: 16px;
    }

    .form-row .form-group {
      flex: 1;
      margin-bottom: 0;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 8px;
      color: var(--text-main);
    }

    input[type="text"], select, textarea {
      width: 100%;
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 12px;
      color: var(--text-main);
      font-size: 0.9rem;
      font-family: var(--font-inter);
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus, select:focus, textarea:focus {
      border-color: var(--accent-blue);
    }

    textarea {
      resize: vertical;
      height: 70px;
    }

    .btn-submit {
      width: 100%;
      background-color: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 14px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin-top: 20px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .btn-submit:hover {
      background-color: #0ea5e9;
    }

    .disclaimer {
      text-align: center;
      font-size: 0.75rem;
      color: #4b5563;
      margin-top: 14px;
    }

    .output-area {
      margin-top: 32px;
      border-top: 1px solid var(--border-color);
      padding-top: 24px;
      display: none;
    }

    .output-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .status-badge {
      background: rgba(16, 185, 129, 0.1);
      color: var(--accent-teal);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-badge .dot {
      width: 6px;
      height: 6px;
      background: var(--accent-teal);
      border-radius: 50%;
    }

    .code-container-wrapper {
      position: relative;
    }

    .code-window {
      background: #070b14;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 16px;
      overflow-x: auto;
      margin-bottom: 16px;
      max-height: 250px;
    }

    pre code {
      color: #38bdf8;
      font-family: monospace;
      font-size: 0.85rem;
      line-height: 1.5;
    }

    .btn-copy {
      position: absolute;
      top: 10px;
      right: 10px;
      background-color: #1f2937;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 5px 10px;
      border-radius: 4px;
      font-size: 0.75rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-copy:hover {
      background-color: #374151;
      border-color: var(--accent-blue);
    }

    .action-footer {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn-action {
      background: #1f2937;
      color: white;
      border: 1px solid var(--border-color);
      padding: 10px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-action:hover {
      background: #374151;
    }

    .btn-highlight {
      background: #0369a1;
      border-color: #0284c7;
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <div class="header-title">Scrutinix AI // System_Generator</div>
    <div class="header-subtitle">Skip manual Figma asset hunting. Enter core parameters to generate production-ready CSS Tokens and Tailwind Config structure instantly.</div>

    <form id="generatorForm">
      <div class="form-group">
        <label>Project Name:</label>
        <input type="text" id="projectName" placeholder="e.g., groovey app" required>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Brand Primary Color (HEX):</label>
          <input type="text" id="primaryColor" placeholder="e.g., #011116" required>
        </div>
        <div class="form-group">
          <label>Select Typography Font:</label>
          <select id="textFont">
            <option value="Roboto">Roboto</option>
            <option value="Inter">Inter</option>
            <option value="Open Sans">Open Sans</option>
            <option value="Poppins">Poppins</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label>Additional Layout / Component Rules:</label>
        <textarea id="customRules" placeholder="e.g., Custom configuration constraints, base-padding: 16px..."></textarea>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">⚡ Generate Tokens & Architecture</button>
    </form>
    
    <div class="disclaimer">Disclaimer: Scrutinix AI provides automation utilities for developers.</div>

    <!-- Output Box Area Matched To Your Screenshot Layout -->
    <div class="output-area" id="outputWorkspace">
      <div class="output-header">
        <div class="status-badge"><span class="dot"></span> Generated Production-Ready Output</div>
      </div>
      
      <div class="code-container-wrapper">
        <button class="btn-copy" id="btnCopyCode">📋 Copy Code</button>
        <div class="code-window">
          <pre><code id="codeDisplay"></code></pre>
        </div>
      </div>

      <div class="action-footer">
        <button class="btn-action" id="exportVariables">📦 Export variables.css</button>
        <button class="btn-action" id="exportTailwind">⚙️ Export tailwind.config.js</button>
        <button class="btn-action btn-highlight" id="exportPdf">📄 Export to PDF</button>
      </div>
    </div>
  </div>

  <script>
    // 🌍 आपका लाइव Google Apps Script URL यहाँ बिल्कुल सही जगह जुड़ चुका है:
    const scriptURL = 'https://google.com';

    let generatedCSS = "";
    let generatedTailwind = "";

    document.getElementById('generatorForm').addEventListener('submit', function(e) {
      e.preventDefault(); // फॉर्म को रिफ्रेश होने से रोकना

      const formData = {
        projectName: document.getElementById('projectName').value,
        primaryColor: document.getElementById('primaryColor').value,
        textFont: document.getElementById('textFont').value,
        customRules: document.getElementById('customRules').value || "None"
      };

      // 1. स्क्रीन पर नीचे डार्क कोड बॉक्स तुरंत दिखाएं (बिना किसी नेटवर्क डिले के)
      generatedCSS = `/* Project Identity: ${formData.projectName.toLowerCase()} */
:root {
  --primary-brand: ${formData.primaryColor};
  --main-hint-stack: '${formData.textFont}', sans-serif;
  --heading-font-stack: '${formData.textFont}', sans-serif;

  /* Custom Configuration Constraints */
  /* ${formData.customRules} */
  --base-padding: 16px;
  --border-radius-xl: 8px;
}`;

      generatedTailwind = /** @type {import('tailwindcss').Config} */\nmodule.exports = {\n  theme: {\n    extend: {\n      colors: {\n        brand: 'var(--primary-brand)',\n      },\n      fontFamily: {\n        sans: ['var(--main-hint-stack)'],\n        heading: ['var(--heading-font-stack)'],\n      }\n    },\n  },\n};;

      document.getElementById('codeDisplay').textContent = generatedCSS;
      document.getElementById('outputWorkspace').style.display = 'block';
      document.getElementById('btnCopyCode').innerHTML = "📋 Copy Code";
      document.getElementById('outputWorkspace').scrollIntoView({ behavior: 'smooth' });

      // 2. बैकग्राउंड में शांत तरीके से डेटा Google Sheets पर भेजना (ताकि एरर आने पर भी UI न रुके)
      fetch(scriptURL, {
        method: 'POST',
        mode: 'no-cors',
        cache: 'no-cache',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(formData)
      }).catch(err => console.log("Database Sync Log:", err.message));
    });

    // 📋 Copy to Clipboard function
    document.getElementById('btnCopyCode').addEventListener('click', function() {
      const codeText = document.getElementById('codeDisplay').textContent;
