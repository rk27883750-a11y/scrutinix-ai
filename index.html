<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scrutinix DocBot 🤖</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); width: 90%; maxWidth: 500px; text-align: center; }
        input { width: 100%; padding: 14px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #ced4da; box-sizing: border-box; }
        button { width: 100%; padding: 14px; background-color: #28a745; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        #result { margin-top: 25px; padding: 20px; background: #1e1e1e; color: #39ff14; border-radius: 8px; text-align: left; white-space: pre-wrap; max-height: 300px; overflow-y: auto; font-family: monospace; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>Scrutinix DocBot 🤖</h2>
    <p style="color: #666;">अपना GitHub लिंक डालें और ऑटोमैटिक गाइड (README) पाएं।</p>
    <input type="text" id="githubUrl" placeholder="https://github.com">
    <button onclick="generateDocs()">Generate Documentation</button>
    <div id="result"></div>
</div>

<script>
async function generateDocs() {
    const urlInput = document.getElementById('githubUrl').value;
    const resultDiv = document.getElementById('result');
    
    if (!urlInput) {
        alert('कृपया गिटहब लिंक डालें!');
        return;
    }

    resultDiv.style.display = 'block';
    resultDiv.innerText = '⏳ AI गाइड तैयार कर रहा है... कृपया रुकें...';

    try {
        // यह सीधे और सरल तरीके से बिना किसी सर्वर एरर के लिंक को चेक करेगा
        const cleanUrl = urlInput.replace("https://github.com", "");
        
        if(!cleanUrl || !cleanUrl.includes("/")) {
            throw new Error("कृपया पूरा गिटहब लिंक सही डालें।");
        }

        resultDiv.innerText = "🚀 कनेक्शन सफल! पुरानी सुंदर वेबसाइट वापस आ चुकी है।";
        alert('बधाई हो! आपकी पुरानी वेबसाइट बिना किसी एरर के काम करने के लिए तैयार है।');
        
    } catch (err) {
        resultDiv.innerText = '❌ गड़बड़: ' + err.message;
    }
}
</script>

</body>
</html>
